name: State 복구 - 리버스 원장 되돌리기 (수동 승인)

# 리버스 매도가 일반 매도로 오분류 정산된 종목의 state 를 재정산 직전으로 되돌립니다 (REPAIR_ACTION=REVERSE_LEDGER_REWIND).
# 워터마크 복원의 목표 주문번호도 입력받지 않고 복구 전 원장의 마지막 항목에서 도출합니다.
# 주문번호 원문은 공개 입력(실행 화면에 노출)으로 받지 않습니다 — 봇이 후보를 정확히 1개로 자동 특정(여러 개면 중단).
# 주문·브로커 호출 없음 (브로커 인증정보 미주입, TRADE_MODE=REPAIR). 캐시의 state 만 바꾸고, 다음 거래 실행이 그 결과를 읽습니다.
#
# ── 실행 범위는 `confirm` 입력으로 정합니다 ────────────────────────────────────
#   (비움)          preview 만                      — 저장·백업 없음
#   BACKUP          preview → backup (+ hashes)     — **state 를 바꾸지 않고** 시크릿·암호화·왕복 검증·업로드 경로만 확인 (apply 의 저장 경로는 확인 대상 아님).
#                    복구 대상·T·hash 입력이 필요 없고 **봇의 복구 미리보기는 건너뜁니다** (정상 state 에는 복구 대상이 없어 미리보기가 실패하므로).
#                    필요한 입력은 broker·restore_key 뿐이며, 파일 SHA-256 은 생략할 수 있습니다 (입력하면 반드시 대조, 생략하면 "사전 지문 대조 없이 백업"으로 표시).
#                    종목은 생략 가능('BACKUP' 또는 'BACKUP <종목>'). 복원본의 파일 SHA·종목별 canonical hash·T 를 시크릿 없는 hashes 잡이 요약에 출력해 REWIND 입력값으로 쓸 수 있습니다.
#   REWIND <종목>   preview → approve → backup → apply
#
# ── 실행 절차 (적용은 두 번 실행합니다) ────────────────────────────────────────
#  `confirm` 은 실행을 **시작할 때** 입력하는 값이라, 같은 실행 안에서 미리보기를 보고 나서 정할 수 없습니다
#  (Environment `state-repair` 에 Required reviewers 가 없으면 approve 단계는 대기 없이 통과합니다).
#   1) `confirm` 을 비우고 실행 → 미리보기만 하고 저장하지 않음. 실행 요약(Summary)에 현재값·목표값이 나란히 표시됩니다.
#   2) 미리보기 출력과, 근거 실행 Evidence 의 `watermark_before` 등을 대조합니다 (실행자가 직접 대조 — 독립된 승인자가 있는 것이 아닙니다).
#   3) 같은 입력에 `confirm`="REWIND <종목>" 을 넣어 다시 실행 → 최신 캐시·hash 재검증 → 암호화 백업 → 적용.
#  실제 복구 전에 `confirm`="BACKUP" 으로 한 번 실행해 백업 경로를 확인하고, 그 요약에서 REWIND 입력값(SHA·hash·T)을 얻으세요.
#  (비운 미리보기로는 backup·apply 가 생략되어 백업 시크릿·암호화·업로드를 확인할 수 없습니다.)
#  1)~3) 사이에 거래 실행이 끼어 새 캐시가 생기면 3) 의 최신 캐시 검사에서 중단됩니다 (새 restore_key·SHA·hash 로 처음부터).
#  따라서 두 번의 실행은 **다음 거래 슬롯 전에** 끝내고, 거래 슬롯(대기 중 실행은 새 실행에 밀려 취소될 수 있음) 시간대는 피하세요.
#
# 안전장치
#  - 복원 대상 캐시 키가 해당 브로커의 **가장 최신 캐시**여야 함 (오래된 캐시로 최신 state 를 덮어쓰는 사고 방지)
#  - 복원한 .state.json 의 SHA-256 이 입력값과 같아야 함 (백업과 동일한 상태임을 확인)
#  - 복구 전 state 를 **암호화 백업(gpg, 왕복 검증)** 해 artifact 로 보관 — 이 백업 잡이 성공해야만 apply 가 시작됩니다.
#    백업 passphrase(secrets.STATE_BACKUP_PASSPHRASE)는 **백업 잡에만** 주입합니다. 봇을 실행하는 잡(preview/apply)에는 시크릿이 없습니다.
#    평문 state 는 공개 artifact 로 올리지 않습니다 (공개 저장소 — artifact 는 누구나 받을 수 있음).
#  - 봇 CAS: 대상 종목 canonical hash·T, 가드 종목 hash (저장 전후 불변)
#  - 복구 직후 ops/verify_repair_rewind.py 가 JSON 만으로 독립 검증 (가드 종목 불변, 허용 필드만 변경, 기대값 재계산)
#  - 검증이 통과해야만 새 캐시(state-<broker>-demo-<run_id>)를 저장. 실패하면 아무 캐시도 만들지 않음
#  - `actions/cache/save` 는 캐시 서비스 장애·예약 충돌에도 경고만 남기고 성공할 수 있으므로, 저장 뒤 **새 키가 실제로 존재하는지** 한 번 더 확인합니다
#  - 실행 요약(Summary)에 복구 적용·독립 검증·캐시 저장·새 캐시 존재 확인 결과를 **따로** 남기고(실패해도 남김, 주문번호 원문 없음),
#    마지막 `summary` 잡이 백업 실패로 apply 가 생략된 경우까지 포함한 전체 흐름의 최종 결과를 남깁니다
#  - 감사용 해시(복구 전후 canonical hash·파일 SHA)는 별도 단계(`continue-on-error`)로 계산해, 계산 실패가 복구·검증 결과를 가리지 않습니다
#  - 거래 워크플로와 같은 concurrency 그룹(trade-<broker>-demo) — 거래 실행과 동시에 돌지 않음
#  - 모의(demo) 전용, main 브랜치에서만 실행
#
# 승인 게이트 (선택 사항): Environment `state-repair` 에 Required reviewers 를 지정하면 apply 직전에 사람의 승인을 기다립니다.
# **지정하지 않아도 정상 동작**합니다 — 미설정이면 approve 단계는 대기 없이 통과하고, 이때는 위 절차의 실행자 대조,
# confirm 입력, CAS·독립 검증, 암호화 백업이 방어선입니다. 이 설정은 이 수동 복구 워크플로에만 영향을 주며 정기 거래 실행과는 무관합니다.
# 협업자가 늘어 작업자≠승인자를 분리하거나 실계좌로 확장할 때 지정하세요 ("Prevent self-review" 는 단독 운영이면 끄세요).
on:
  workflow_dispatch:
    inputs:
      broker:
        description: '브로커 (demo 전용)'
        required: true
        type: choice
        options: [nhplug, kis, kiwoom, ls]
        default: nhplug
      action:
        description: '복구 동작 — REVERSE_LEDGER_REWIND(원장 되돌리기) 또는 REVERSE_WATERMARK_RESTORE(되돌리기 후 워터마크 복원)'
        required: true
        type: choice
        options: [REVERSE_LEDGER_REWIND, REVERSE_WATERMARK_RESTORE]
        default: REVERSE_LEDGER_REWIND
      restore_key:
        description: '복원할 캐시 키 (예: state-nhplug-demo-42287486160) — 해당 브로커의 최신 캐시여야 함'
        required: true
        type: string
      expect_file_sha256:
        description: '복원한 .state.json 의 SHA-256 (백업의 원본 SHA-256) — BACKUP 에서만 생략 가능(생략하면 사전 지문 대조 없이 백업했다고 표시)'
        required: false
        type: string
      symbol:
        description: '대상 종목 (예: SOXL) — BACKUP 에서는 생략 가능'
        required: false
        type: string
      expect_hash:
        description: '대상 종목 canonical_state_hash — BACKUP 에서는 생략 가능'
        required: false
        type: string
      expect_t:
        description: '대상 종목 현재 T (예: 14.4375) — BACKUP 에서는 생략 가능'
        required: false
        type: string
      guard_symbol:
        description: '절대 바뀌면 안 되는 종목 (예: TQQQ) — BACKUP 에서는 생략 가능'
        required: false
        type: string
      guard_hash:
        description: '가드 종목 canonical_state_hash — BACKUP 에서는 생략 가능'
        required: false
        type: string
      target_last_updated:
        description: 'REVERSE_WATERMARK_RESTORE 전용: 복원할 last_updated (ISO, 현재보다 과거, 예: 2026-11-04T19:10:00+00:00). 근거 실행 Evidence 의 watermark_before 와 직접 대조한 값을 넣으세요'
        required: false
        type: string
      evidence_run_id:
        description: 'REVERSE_WATERMARK_RESTORE 필수(숫자): 목표값의 근거로 삼은 Evidence 가 있는 실행 번호 (값이 맞다는 증명은 아니고 근거를 추적하기 위한 기록). 되돌리기 동작은 선택'
        required: false
        type: string
      confirm:
        description: "'REWIND <종목>' 적용 / 'BACKUP' 백업만(복구 미적용·봇 미리보기 없음·state 변경 없음, 종목 생략 가능 — 'BACKUP <종목>'도 허용) / 비우면 미리보기만 (예: REWIND SOXL). 먼저 비우고 실행해 출력을 대조한 뒤, 같은 입력에 confirm 을 넣어 다시 실행 — 다시 실행"
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  # 입력은 셸 문자열에 ${{ }} 로 직접 삽입하지 않고 env 로만 전달합니다
  IN_BROKER: ${{ inputs.broker }}
  IN_RESTORE_KEY: ${{ inputs.restore_key }}
  IN_FILE_SHA: ${{ inputs.expect_file_sha256 }}
  IN_SYMBOL: ${{ inputs.symbol }}
  IN_HASH: ${{ inputs.expect_hash }}
  IN_T: ${{ inputs.expect_t }}
  IN_GUARD_SYMBOL: ${{ inputs.guard_symbol }}
  IN_GUARD_HASH: ${{ inputs.guard_hash }}
  IN_ACTION: ${{ inputs.action }}
  IN_TARGET_UPDATED: ${{ inputs.target_last_updated }}
  IN_EVIDENCE_RUN: ${{ inputs.evidence_run_id }}

jobs:
  preview:
    name: 미리보기 (저장 없음)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.broker }}-demo
    concurrency:
      group: trade-${{ inputs.broker }}-demo
      cancel-in-progress: false
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      want_apply: ${{ steps.mode.outputs.want_apply }}
      want_backup: ${{ steps.mode.outputs.want_backup }}
    steps:
      # 실행 범위를 **가장 먼저** 정합니다 — 이후 입력 검증과 봇 미리보기 실행 여부가 이 값에 달려 있습니다.
      # (BACKUP 은 복구 대상이 없는 정상 state 에서도 돌아야 하므로 봇의 복구 미리보기를 건너뜁니다.)
      - name: 실행 범위 결정 (confirm)
        id: mode
        env:
          IN_CONFIRM: ${{ inputs.confirm }}
        run: |
          # 정확히 일치하는 문구만 인정합니다 (대소문자·공백·종목이 다르면 미리보기만)
          mode=preview
          if [[ -n "$IN_SYMBOL" && "$IN_CONFIRM" == "REWIND ${IN_SYMBOL}" ]]; then
            mode=apply
          elif [[ "$IN_CONFIRM" == "BACKUP" || ( -n "$IN_SYMBOL" && "$IN_CONFIRM" == "BACKUP ${IN_SYMBOL}" ) ]]; then
            mode=backup
          fi
          want_apply=false
          want_backup=false
          if [[ "$mode" == "apply" ]]; then want_apply=true; fi
          if [[ "$mode" != "preview" ]]; then want_backup=true; fi
          {
            echo "mode=$mode"
            echo "want_apply=$want_apply"
            echo "want_backup=$want_backup"
          } >> "$GITHUB_OUTPUT"
          case "$mode" in
            apply) echo "confirm 문구 일치 → 승인 게이트 → 백업 → 적용 단계로 진행합니다." ;;
            backup) echo "BACKUP 문구 일치 → 백업만 진행합니다 (복구는 적용하지 않고 봇 미리보기도 건너뛰며 state 도 바꾸지 않습니다)." ;;
            *) echo "confirm 문구가 없거나 다릅니다 → 미리보기만 하고 종료합니다." ;;
          esac

      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install && uv sync

      - name: 입력 형식 검증
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$IN_RESTORE_KEY" =~ ^state-${IN_BROKER}-demo-[0-9]+$ ]] || fail "restore_key 형식이 올바르지 않습니다 (state-<broker>-demo-<숫자>)"
          if [[ "$MODE" == "backup" ]]; then
            # BACKUP: 복구 대상·T·hash 는 쓰지 않으므로 요구하지 않습니다. 파일 SHA-256 은 생략할 수 있지만,
            # 입력했다면 형식이 맞아야 하고 이후 반드시 복원본과 대조합니다.
            if [[ -n "$IN_FILE_SHA" ]]; then
              [[ "$IN_FILE_SHA" =~ ^[0-9a-f]{64}$ ]] || fail "expect_file_sha256 은 소문자 64자리 hex 여야 합니다 (생략하려면 비워 두세요)"
            fi
            if [[ -n "$IN_EVIDENCE_RUN" ]]; then
              [[ "$IN_EVIDENCE_RUN" =~ ^[0-9]{1,20}$ ]] || fail "evidence_run_id 는 숫자여야 합니다"
            fi
            exit 0
          fi
          # 미리보기·REWIND: 기존과 같이 모든 입력이 필수입니다
          [[ "$IN_FILE_SHA" =~ ^[0-9a-f]{64}$ ]] || fail "expect_file_sha256 은 소문자 64자리 hex 여야 합니다"
          [[ "$IN_HASH" =~ ^[0-9a-f]{64}$ ]] || fail "expect_hash 형식 오류"
          [[ "$IN_GUARD_HASH" =~ ^[0-9a-f]{64}$ ]] || fail "guard_hash 형식 오류"
          [[ "$IN_SYMBOL" =~ ^[A-Z]{1,6}$ ]] || fail "symbol 형식 오류"
          [[ "$IN_GUARD_SYMBOL" =~ ^[A-Z]{1,6}$ ]] || fail "guard_symbol 형식 오류"
          [[ "$IN_SYMBOL" != "$IN_GUARD_SYMBOL" ]] || fail "가드 종목은 대상 종목과 달라야 합니다"
          [[ "$IN_T" =~ ^[0-9]+(\.[0-9]+)?$ ]] || fail "expect_t 형식 오류"
          if [[ "$IN_ACTION" == "REVERSE_WATERMARK_RESTORE" ]]; then
            [[ "$IN_TARGET_UPDATED" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+\+00:00$ ]] || fail "target_last_updated 는 UTC ISO 형식(…+00:00)이어야 합니다"
            # 근거 추적용 기록입니다 (값의 정확성을 증명하지는 않음). 워터마크 복원에서는 필수입니다.
            [[ "$IN_EVIDENCE_RUN" =~ ^[0-9]{1,20}$ ]] || fail "evidence_run_id(목표값의 근거 Evidence 가 있는 실행 번호, 숫자)가 필요합니다"
          elif [[ -n "$IN_EVIDENCE_RUN" ]]; then
            [[ "$IN_EVIDENCE_RUN" =~ ^[0-9]{1,20}$ ]] || fail "evidence_run_id 는 숫자여야 합니다"
          fi

      - name: 복원 대상이 해당 브로커의 최신 캐시인지 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh cache list -R "$GITHUB_REPOSITORY" --key "state-${IN_BROKER}-demo-" --ref refs/heads/main --sort created_at --order desc --limit 1 --json key --jq '.[0].key')"
          if [[ "$latest" != "$IN_RESTORE_KEY" ]]; then
            echo "::error::restore_key 가 최신 캐시가 아닙니다 (최신: $latest). 오래된 상태로 덮어쓸 수 있어 중단합니다."
            exit 1
          fi
          echo "최신 캐시 확인: $latest"

      - name: state 캐시 복원 (정확한 키)
        uses: actions/cache/restore@v4
        with:
          path: .state.json
          key: ${{ inputs.restore_key }}
          fail-on-cache-miss: true

      - name: 복원본 SHA-256 확인
        run: |
          set -euo pipefail
          if [[ -z "$IN_FILE_SHA" ]]; then
            echo "입력 SHA-256 을 생략했습니다 (BACKUP 모드) — 사전 지문 대조 없이 진행합니다."
          else
            echo "$IN_FILE_SHA  .state.json" | sha256sum -c -
          fi

      # BACKUP 은 복구를 하지 않으므로 봇의 복구 미리보기를 실행하지 않습니다.
      # (미리보기는 복구 대상이 있어야 성공해서, 정상 state 에서 실행하면 백업 전에 실패합니다.)
      - name: 미리보기 (저장 없음)
        id: dryrun
        if: steps.mode.outputs.mode != 'backup'
        env:
          BROKER: ${{ inputs.broker }}
          BROKER_MODE: demo
          TRADE_MODE: REPAIR
          REPAIR_ACTION: ${{ inputs.action }}
          REPAIR_REWIND_TARGET_LAST_UPDATED: ${{ inputs.target_last_updated }}
          REPAIR_REWIND_SYMBOL: ${{ inputs.symbol }}
          REPAIR_REWIND_EXPECT_HASH: ${{ inputs.expect_hash }}
          REPAIR_REWIND_EXPECT_T: ${{ inputs.expect_t }}
          REPAIR_REWIND_GUARD_SYMBOL: ${{ inputs.guard_symbol }}
          REPAIR_REWIND_GUARD_HASH: ${{ inputs.guard_hash }}
          SYMBOLS: ${{ vars.SYMBOLS }}
          TQQQ_SPLITS: ${{ vars.TQQQ_SPLITS }}
          TQQQ_SYMBOL_TYPE: ${{ vars.TQQQ_SYMBOL_TYPE }}
          TQQQ_SEED: ${{ vars.TQQQ_SEED }}
          SOXL_SPLITS: ${{ vars.SOXL_SPLITS }}
          SOXL_SYMBOL_TYPE: ${{ vars.SOXL_SYMBOL_TYPE }}
          SOXL_SEED: ${{ vars.SOXL_SEED }}
        run: |
          set -euo pipefail
          uv run python trading_bot.py
          # 미리보기는 저장하지 않으므로 파일이 그대로여야 합니다
          # (미리보기 실행이 실수로 state 를 쓰는 회귀를 잡는 방어선 — 이 잡에는 캐시 저장 단계가 없습니다)
          echo "$IN_FILE_SHA  .state.json" | sha256sum -c -

      - name: 미리보기 요약 (현재값·목표값 나란히)
        if: always()
        env:
          DRYRUN_OUTCOME: ${{ steps.dryrun.outcome }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          python3 - <<'PY'
          import json
          import os

          env = os.environ
          mode = env.get("MODE", "")
          if mode == "backup":
              lines = [
                  "## 복구 워크플로 — BACKUP 모드",
                  "",
                  f"- 브로커: `{env.get('IN_BROKER', '')}` / 복원 캐시: `{env.get('IN_RESTORE_KEY', '')}`",
                  "- 봇의 복구 미리보기는 **실행하지 않았습니다** (BACKUP 은 복구를 하지 않으며, 정상 state 에는 복구 대상이 없어 미리보기가 실패하기 때문입니다).",
                  "- 이 실행은 암호화 백업과 복원 state 지문 계산만 하고 state 를 바꾸지 않습니다. 결과는 `backup`·`hashes` 잡과 최종 요약을 보세요.",
              ]
              with open(env["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
                  out.write("\n".join(lines) + "\n")
              raise SystemExit(0)
          symbol = env.get("IN_SYMBOL", "")
          try:
              with open(".state.json", encoding="utf-8") as f:
                  current = (json.load(f).get(symbol) or {})
          except (OSError, ValueError):
              current = {}
          action = env.get("IN_ACTION", "")
          lines = [
              "## 복구 미리보기 (저장 없음)",
              "",
              f"- 브로커/종목: `{env.get('IN_BROKER', '')}` / `{symbol}`",
              f"- 복구 동작: `{action}`",
              f"- 복원 캐시: `{env.get('IN_RESTORE_KEY', '')}`",
              f"- 미리보기 실행 결과: `{env.get('DRYRUN_OUTCOME', '') or '미실행'}` (skipped 는 앞 단계 실패로 건너뜀)",
              "",
              "| 항목 | 현재(복원본) | 목표/기대 |",
              "|---|---|---|",
              f"| T | {current.get('T', '(없음)')} | 입력 expect_t = {env.get('IN_T', '')} (되돌리기는 reverse_base_t 로 복귀) |",
              f"| net_invested | {current.get('net_invested', '(없음)')} | (되돌리기는 반영 금액만큼 증가) |",
              f"| last_updated | {current.get('last_updated', '(없음)')} | "
              + (f"{env.get('IN_TARGET_UPDATED', '')}" if action == "REVERSE_WATERMARK_RESTORE" else "변경 없음")
              + " |",
              "",
          ]
          if action == "REVERSE_WATERMARK_RESTORE":
              lines += [
                  f"- 근거 Evidence 실행 번호(evidence_run_id): `{env.get('IN_EVIDENCE_RUN', '')}`",
                  "- **목표 last_updated 가 그 Evidence 의 `watermark_before` 와 같은지 직접 대조하세요.** 이 워크플로는 값의 정확성을 확인하지 못합니다.",
                  "",
              ]
          if mode == "apply":
              lines.append("- 이 실행에는 confirm 이 들어 있어 승인 게이트 → 백업 → 적용 단계로 이어집니다.")
          else:
              lines += [
                  "- 이 실행은 미리보기만 하고 끝납니다 (backup·apply 는 실행되지 않으므로 백업 경로는 확인되지 않습니다).",
                  "- 백업 경로(시크릿·암호화·업로드)만 먼저 점검하려면 **confirm=`BACKUP`** 으로, 대조를 마쳤다면 **같은 입력에 confirm=`REWIND <종목>`** 으로 다시 실행하세요.",
                  "- 적용 실행은 다음 거래 슬롯 전에 끝내세요 (그 사이 새 캐시가 생기면 최신 캐시 검사에서 중단됩니다).",
              ]
          with open(env["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY

  approve:
    name: 승인 게이트
    needs: preview
    if: needs.preview.outputs.want_apply == 'true'
    runs-on: ubuntu-latest
    # (선택) Required reviewers 를 지정하면 여기서 멈추고 사람이 미리보기 로그를 확인해 승인합니다. 미지정이면 그대로 통과합니다.
    environment: state-repair
    steps:
      - run: echo "승인 게이트를 통과했습니다. Required reviewers 미설정 시에는 별도 승인 대기 없이 진행됩니다."

  backup:
    name: 복구 전 암호화 백업 (성공해야 적용 시작)
    needs: [preview, approve]
    # BACKUP 모드는 approve 가 건너뛰어져도 실행돼야 하므로 status 함수(!cancelled())를 쓰고, 조건을 명시합니다.
    #  - preview 가 성공했고 백업이 요청된 경우(BACKUP 또는 REWIND)만
    #  - REWIND 모드(want_apply=true)에서는 approve 가 성공한 경우만 (승인 실패·반려 시 백업도 하지 않음)
    if: >-
      ${{ !cancelled()
      && github.ref == 'refs/heads/main'
      && needs.preview.result == 'success'
      && needs.preview.outputs.want_backup == 'true'
      && (needs.preview.outputs.want_apply != 'true' || needs.approve.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      MODE: ${{ needs.preview.outputs.mode }}
    # 이 잡은 캐시를 읽기만 합니다(저장 없음). 봇 코드를 실행하지 않으므로 STATE_BACKUP_PASSPHRASE 는 이 잡에만 주입합니다.
    # 거래 concurrency 그룹에는 넣지 않습니다 — 사이에 거래가 끼면 apply 의 최신 캐시 재확인에서 중단됩니다.
    steps:
      - name: state 캐시 복원 (정확한 키)
        uses: actions/cache/restore@v4
        with:
          path: .state.json
          key: ${{ inputs.restore_key }}
          fail-on-cache-miss: true

      - name: 복원본 SHA-256 확인 후 암호화·왕복 검증 (state 값은 출력하지 않음)
        id: encrypt
        shell: bash
        env:
          PASSPHRASE: ${{ secrets.STATE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          # apply 가 수정할 파일과 바이트 단위로 같은 것을 백업합니다 (같은 SHA-256 입력으로 고정).
          # 입력 SHA 를 생략할 수 있는 것은 BACKUP 모드뿐입니다. 입력했다면 반드시 대조합니다.
          if [[ -n "$IN_FILE_SHA" ]]; then
            echo "$IN_FILE_SHA  .state.json" | sha256sum -c -
            echo "pre_check=matched" >> "$GITHUB_OUTPUT"
          elif [[ "${MODE:-}" == "backup" ]]; then
            echo "입력 SHA-256 이 없어 사전 지문 대조 없이 백업합니다 (BACKUP 모드)."
            echo "pre_check=skipped" >> "$GITHUB_OUTPUT"
          else
            echo "::error::expect_file_sha256 이 없어 사전 지문 대조 없이는 복구용 백업을 만들 수 없습니다"
            exit 1
          fi
          test -s .state.json
          python3 -m json.tool .state.json > /dev/null
          if [[ -z "$PASSPHRASE" ]]; then
            echo "::error::STATE_BACKUP_PASSPHRASE 가 비어 있거나 사용할 수 없어 백업할 수 없습니다 — 복구를 진행하지 않습니다"
            exit 1
          fi
          # "Re-run all jobs" 는 run_id 가 같고 run_attempt 만 올라갑니다. artifact 는 덮어쓸 수 없으므로 이름에 시도 번호를 넣습니다.
          name="repair-backup-${IN_BROKER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          printf '%s' "$PASSPHRASE" |
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --symmetric \
              --cipher-algo AES256 --s2k-digest-algo SHA256 \
              --output "${name}.gpg" .state.json
          test -s "${name}.gpg"

          # 왕복 검증: 방금 만든 암호문을 다시 복호화해 원본과 바이트 단위로 같은지 확인합니다.
          printf '%s' "$PASSPHRASE" |
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --decrypt --output roundtrip.state.json "${name}.gpg"
          cmp .state.json roundtrip.state.json
          rm -f roundtrip.state.json

          # 원본·암호문 SHA-256 은 artifact 안의 파일로 남깁니다 (복호화본이 원본과 같은지 대조하는 기준값).
          sha256sum .state.json | awk '{print $1}' > "${name}.state.sha256"
          sha256sum "${name}.gpg" | awk '{print $1}' > "${name}.gpg.sha256"
          echo "왕복 검증 통과: 복호화본 == 원본 (평문은 업로드하지 않습니다)"

      - name: 암호화 백업만 업로드 (보관 30일)
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: repair-backup-${{ inputs.broker }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            repair-backup-${{ inputs.broker }}-${{ github.run_id }}-${{ github.run_attempt }}.gpg
            repair-backup-${{ inputs.broker }}-${{ github.run_id }}-${{ github.run_attempt }}.state.sha256
            repair-backup-${{ inputs.broker }}-${{ github.run_id }}-${{ github.run_attempt }}.gpg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: 백업 결과 요약
        if: always()
        env:
          ENCRYPT_OUTCOME: ${{ steps.encrypt.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          PRE_CHECK: ${{ steps.encrypt.outputs.pre_check }}
        run: |
          if [[ "${MODE:-}" == "backup" ]]; then
            next="BACKUP 모드 — 복구는 적용되지 않았고 state 는 바뀌지 않았습니다"
          else
            next="적용 단계가 진행됩니다"
          fi
          {
            echo "## 복구 전 암호화 백업"
            echo
            echo "| 단계 | 결과 |"
            echo "|---|---|"
            echo "| 암호화·왕복 검증 | ${ENCRYPT_OUTCOME:-미실행} |"
            echo "| artifact 업로드(보관 30일) | ${UPLOAD_OUTCOME:-미실행} |"
            case "${PRE_CHECK:-}" in
              matched) echo "| 복원본 SHA-256 사전 대조 | 입력값과 일치 |" ;;
              skipped) echo "| 복원본 SHA-256 사전 대조 | **사전 지문 대조 없이 백업** (입력 생략 — BACKUP 모드에서만 허용) |" ;;
              *) echo "| 복원본 SHA-256 사전 대조 | 미실행 |" ;;
            esac
            echo
            if [[ "${ENCRYPT_OUTCOME:-}" == "success" && "${UPLOAD_OUTCOME:-}" == "success" ]]; then
              echo "- 백업 성공 → ${next}. artifact: \`repair-backup-${IN_BROKER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\` (gpg 암호화본, 복호화는 STATE_BACKUP_PASSPHRASE)"
            else
              echo "- **백업 실패 → 복구는 진행되지 않습니다.** 캐시는 바뀌지 않았습니다."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # canonical hash 는 저장소 코드(src/state.py)로 계산해야 하므로, 시크릿이 있는 backup 잡이 아니라 **시크릿 없는 별도 잡**에서 계산합니다.
  # (읽기 전용: 캐시 복원 + 계산만. 저장 없음, 브로커 호출 없음, 환경(environment) 불필요)
  hashes:
    name: 복원 state 지문 계산 (BACKUP 모드, 시크릿 없음)
    needs: preview
    if: >-
      ${{ !cancelled()
      && github.ref == 'refs/heads/main'
      && needs.preview.result == 'success'
      && needs.preview.outputs.mode == 'backup' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install && uv sync

      - name: state 캐시 복원 (정확한 키)
        uses: actions/cache/restore@v4
        with:
          path: .state.json
          key: ${{ inputs.restore_key }}
          fail-on-cache-miss: true

      - name: 파일 SHA-256·종목별 canonical hash 계산 (읽기 전용)
        run: |
          set -euo pipefail
          uv run python ops/repair_state_fingerprint.py --state .state.json \
            --expect-sha "$IN_FILE_SHA" --summary "$GITHUB_STEP_SUMMARY"

  apply:
    name: 적용 (복구 + 독립 검증 + 캐시 저장)
    needs: [approve, backup]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.broker }}-demo
    concurrency:
      group: trade-${{ inputs.broker }}-demo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install && uv sync

      - name: 여전히 최신 캐시인지 재확인 (승인 대기 중 거래가 실행됐다면 중단)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh cache list -R "$GITHUB_REPOSITORY" --key "state-${IN_BROKER}-demo-" --ref refs/heads/main --sort created_at --order desc --limit 1 --json key --jq '.[0].key')"
          if [[ "$latest" != "$IN_RESTORE_KEY" ]]; then
            echo "::error::승인 대기 중 더 새로운 캐시가 생겼습니다 (최신: $latest). 중단합니다 — 처음부터 다시 실행하세요."
            exit 1
          fi

      - name: state 캐시 복원 (정확한 키)
        uses: actions/cache/restore@v4
        with:
          path: .state.json
          key: ${{ inputs.restore_key }}
          fail-on-cache-miss: true

      - name: 복원본 SHA-256 확인 및 복구 전 사본 보관
        run: |
          set -euo pipefail
          echo "$IN_FILE_SHA  .state.json" | sha256sum -c -
          cp .state.json "$RUNNER_TEMP/state.before.json"

      - name: 복구 적용 (REPAIR, 주문 없음)
        id: repair
        env:
          BROKER: ${{ inputs.broker }}
          BROKER_MODE: demo
          TRADE_MODE: REPAIR
          REPAIR_ACTION: ${{ inputs.action }}
          REPAIR_REWIND_TARGET_LAST_UPDATED: ${{ inputs.target_last_updated }}
          REPAIR_REWIND_SYMBOL: ${{ inputs.symbol }}
          REPAIR_REWIND_EXPECT_HASH: ${{ inputs.expect_hash }}
          REPAIR_REWIND_EXPECT_T: ${{ inputs.expect_t }}
          REPAIR_REWIND_GUARD_SYMBOL: ${{ inputs.guard_symbol }}
          REPAIR_REWIND_GUARD_HASH: ${{ inputs.guard_hash }}
          REPAIR_REWIND_APPLY: 'true'
          SYMBOLS: ${{ vars.SYMBOLS }}
          TQQQ_SPLITS: ${{ vars.TQQQ_SPLITS }}
          TQQQ_SYMBOL_TYPE: ${{ vars.TQQQ_SYMBOL_TYPE }}
          TQQQ_SEED: ${{ vars.TQQQ_SEED }}
          SOXL_SPLITS: ${{ vars.SOXL_SPLITS }}
          SOXL_SYMBOL_TYPE: ${{ vars.SOXL_SYMBOL_TYPE }}
          SOXL_SEED: ${{ vars.SOXL_SEED }}
        run: uv run python trading_bot.py

      - name: 독립 검증 (실패하면 캐시를 저장하지 않음)
        id: verify
        run: |
          set -euo pipefail
          if [[ "$IN_ACTION" == "REVERSE_WATERMARK_RESTORE" ]]; then
            python3 ops/verify_repair_rewind.py "$RUNNER_TEMP/state.before.json" .state.json --symbol "$IN_SYMBOL" \
              --mode watermark --target-last-updated "$IN_TARGET_UPDATED"
          else
            python3 ops/verify_repair_rewind.py "$RUNNER_TEMP/state.before.json" .state.json --symbol "$IN_SYMBOL"
          fi

      - name: 새 state 캐시 저장
        id: save
        uses: actions/cache/save@v4
        with:
          path: .state.json
          key: state-${{ inputs.broker }}-demo-${{ github.run_id }}

      # actions/cache/save 는 캐시 서비스 장애·예약 충돌 때도 경고만 남기고 성공으로 끝날 수 있습니다.
      # 그래서 step outcome 만으로 "저장 성공"이라고 하지 않고, 새 키가 실제로 존재하는지 확인합니다.
      - name: 새 캐시가 실제로 만들어졌는지 확인
        id: confirm_saved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          key="state-${IN_BROKER}-demo-${GITHUB_RUN_ID}"
          tries="${CONFIRM_TRIES:-6}"
          wait_s="${CONFIRM_SLEEP:-5}"
          for ((i = 1; i <= tries; i++)); do
            # 출력을 먼저 변수에 담습니다 (grep -q 가 일찍 끝나 gh 가 SIGPIPE 로 실패 처리되는 것을 피함)
            found="$(gh cache list -R "$GITHUB_REPOSITORY" --key "$key" --ref refs/heads/main --limit 5 --json key --jq '.[].key' || true)"
            if grep -Fxq "$key" <<< "$found"; then
              echo "새 캐시 확인: $key"
              exit 0
            fi
            sleep "$wait_s"
          done
          echo "::error::새 캐시($key)를 찾지 못했습니다. actions/cache/save 는 실패해도 경고만 남기고 성공할 수 있어, 복구 결과가 운영 캐시에 반영되지 않았을 수 있습니다. 거래를 재개하기 전에 캐시 목록을 확인하세요."
          exit 1

      - name: 저장 결과 안내
        run: |
          echo "새 캐시 저장 확인: state-${IN_BROKER}-demo-${GITHUB_RUN_ID}"
          echo "다음 단계: DRY 1건으로 재정산 결과(T, net_invested, day_count)를 확인하세요."

      # 감사용 해시(복구 전후 canonical hash·파일 SHA)는 복구·독립 검증과 별개의 기록입니다.
      # 계산이 실패해도 job 결과나 복구·검증·저장 결과를 바꾸지 않도록 continue-on-error 로 분리합니다.
      - name: 감사용 해시 계산 (읽기 전용, 실패해도 복구 결과와 무관)
        id: audit_hashes
        if: always()
        continue-on-error: true
        env:
          BROKER: ${{ inputs.broker }}
          BROKER_MODE: demo
          TRADE_MODE: REPAIR
          SYMBOLS: ${{ vars.SYMBOLS }}
          TQQQ_SPLITS: ${{ vars.TQQQ_SPLITS }}
          TQQQ_SYMBOL_TYPE: ${{ vars.TQQQ_SYMBOL_TYPE }}
          TQQQ_SEED: ${{ vars.TQQQ_SEED }}
          SOXL_SPLITS: ${{ vars.SOXL_SPLITS }}
          SOXL_SYMBOL_TYPE: ${{ vars.SOXL_SYMBOL_TYPE }}
          SOXL_SEED: ${{ vars.SOXL_SEED }}
        run: |
          uv run python ops/repair_audit_hashes.py \
            --before "$RUNNER_TEMP/state.before.json" --after .state.json \
            --symbol "$IN_SYMBOL" --guard "$IN_GUARD_SYMBOL" --out "$RUNNER_TEMP/audit_hashes.json"

      - name: 감사 요약 (실패해도 기록)
        if: always()
        env:
          AUDIT_HASH_OUTCOME: ${{ steps.audit_hashes.outcome }}
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SAVE_OUTCOME: ${{ steps.save.outcome }}
          CONFIRM_OUTCOME: ${{ steps.confirm_saved.outcome }}
          BACKUP_RESULT: ${{ needs.backup.result }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os

          env = os.environ


          def load(path):
              try:
                  with open(path, encoding="utf-8") as f:
                      return json.load(f)
              except (OSError, ValueError):
                  return None


          def sha(path):
              try:
                  with open(path, "rb") as f:
                      return hashlib.sha256(f.read()).hexdigest()
              except OSError:
                  return "(없음)"


          symbol = env.get("IN_SYMBOL", "")
          guard = env.get("IN_GUARD_SYMBOL", "")
          before_path = os.path.join(env.get("RUNNER_TEMP", "."), "state.before.json")
          before = (load(before_path) or {}).get(symbol) or {}
          after = (load(".state.json") or {}).get(symbol) or {}
          # 감사용 해시는 별도 단계가 계산합니다. 없거나 깨졌으면 "(계산 실패)" 로 표기하고 판정에는 쓰지 않습니다.
          audit = load(os.path.join(env.get("RUNNER_TEMP", "."), "audit_hashes.json")) or {}
          canon = audit.get("canonical_hash") or {}
          NA = "(계산 실패)"


          def canon_of(when, sym):
              return (canon.get(when) or {}).get(sym) or NA


          input_sha = env.get("IN_FILE_SHA", "")
          before_sha = sha(before_path)
          guard_before, guard_after = canon_of("before", guard), canon_of("after", guard)
          if NA in (guard_before, guard_after):
              guard_state = "확인 불가"
          else:
              guard_state = "예" if guard_before == guard_after else "**아니오**"


          def change(key):
              return f"{before.get(key, '(없음)')} → {after.get(key, '(없음)')}"


          repair = env.get("REPAIR_OUTCOME") or "미실행"
          verify = env.get("VERIFY_OUTCOME") or "미실행"
          save = env.get("SAVE_OUTCOME") or "미실행"
          confirm = env.get("CONFIRM_OUTCOME") or "미실행"
          run_id = env.get("GITHUB_RUN_ID", "")
          if save == "success" and confirm == "success":
              verdict = f"✅ 독립 검증 통과 + 새 캐시 저장 확인: `state-{env.get('IN_BROKER', '')}-demo-{run_id}`"
          elif save == "success":
              verdict = ("⚠️ 독립 검증은 통과했고 저장 단계는 끝났지만 **새 캐시가 존재하는지 확인하지 못했습니다**. "
                         "복구가 운영 캐시에 반영되지 않았을 수 있으니 캐시 목록을 확인하세요.")
          elif verify == "success":
              verdict = ("⚠️ 독립 검증은 통과했지만 **캐시 저장 단계가 실패**했습니다. 저장 완료를 확인하지 못했으므로 "
                         f"캐시 목록에서 `state-{env.get('IN_BROKER', '')}-demo-{run_id}` 가 있는지 확인하세요.")
          else:
              verdict = "❌ 복구 또는 독립 검증이 통과하지 못해 캐시 저장을 시도하지 않았습니다. 운영 캐시는 복구 전 그대로입니다."
          watermark_changed = "예" if before.get("last_processed_ordno") != after.get("last_processed_ordno") else "아니오"
          lines = [
              "## 복구 감사 기록",
              "",
              verdict,
              "",
              "| 단계 | 결과 |",
              "|---|---|",
              f"| 암호화 백업 잡 | {env.get('BACKUP_RESULT') or '미실행'} |",
              f"| 복구 적용 | {repair} |",
              f"| 독립 검증 | {verify} |",
              f"| 캐시 저장 단계 | {save} |",
              f"| 새 캐시 존재 확인 | {confirm} |",
              "",
              "| 기록 | 값 |",
              "|---|---|",
              f"| 워크플로 커밋 | `{env.get('WORKFLOW_SHA', '')}` |",
              f"| 실행 번호 | `{run_id}` |",
              f"| 브로커 / 종목 / 동작 | `{env.get('IN_BROKER', '')}` / `{symbol}` / `{env.get('IN_ACTION', '')}` |",
              f"| 복원한 캐시 | `{env.get('IN_RESTORE_KEY', '')}` |",
              f"| 복원본 파일 SHA-256 — 입력값 | `{input_sha}` |",
              f"| 복원본 파일 SHA-256 — 복구 전 사본 계산값 | `{before_sha}` ({'입력값과 일치' if before_sha == input_sha else '**입력값과 다름**'}) |",
              f"| 복구 후 파일 SHA-256 — 러너 안 계산값 | `{sha('.state.json')}` |",
              f"| 대상 종목 `{symbol}` canonical hash — 입력(CAS) | `{env.get('IN_HASH', '')}` |",
              f"| 대상 종목 canonical hash — 복구 전 계산값 | `{canon_of('before', symbol)}` |",
              f"| 대상 종목 canonical hash — 복구 후 계산값 | `{canon_of('after', symbol)}` |",
              f"| 가드 종목 `{guard}` canonical hash — 입력(CAS) | `{env.get('IN_GUARD_HASH', '')}` |",
              f"| 가드 종목 canonical hash — 복구 전 / 후 계산값 | `{guard_before}` / `{guard_after}` |",
              f"| 가드 종목 불변 | {guard_state} |",
              f"| T | {change('T')} |",
              f"| net_invested | {change('net_invested')} |",
              f"| last_updated(워터마크) | {change('last_updated')} |",
              f"| last_processed_ordno 변경 여부 (원문 미기록) | {watermark_changed} |",
              f"| 근거 Evidence 실행 번호 | `{env.get('IN_EVIDENCE_RUN', '') or '(미입력)'}` |",
              "",
              "- 복구 후 값은 러너 안의 파일 기준이며, **새 캐시 존재 확인까지 성공했을 때만** 운영 캐시에 반영된 것입니다.",
              f"- 감사용 해시 계산 단계: `{env.get('AUDIT_HASH_OUTCOME') or '미실행'}` (계산 실패는 복구·검증 결과와 무관하며 위 판정에 영향을 주지 않습니다).",
              f"- 복구 전 상태의 암호화 백업: artifact `repair-backup-{env.get('IN_BROKER', '')}-{run_id}-{env.get('GITHUB_RUN_ATTEMPT', '1')}` (보관 30일, 복호화는 STATE_BACKUP_PASSPHRASE).",
          ]
          with open(env["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY

  summary:
    name: 최종 요약 (전체 흐름)
    needs: [preview, approve, backup, hashes, apply]
    # 어느 잡이 실패·생략되든 전체 흐름의 최종 결과를 한곳에 남깁니다 (취소된 실행 제외).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: 전체 흐름 최종 요약
        env:
          MODE: ${{ needs.preview.outputs.mode }}
          PREVIEW_RESULT: ${{ needs.preview.result }}
          APPROVE_RESULT: ${{ needs.approve.result }}
          BACKUP_RESULT: ${{ needs.backup.result }}
          HASHES_RESULT: ${{ needs.hashes.result }}
          APPLY_RESULT: ${{ needs.apply.result }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os

          env = os.environ


          def res(name):
              return env.get(name) or "미실행"


          mode = env.get("MODE", "")
          preview, approve, backup, apply_ = (res("PREVIEW_RESULT"), res("APPROVE_RESULT"), res("BACKUP_RESULT"), res("APPLY_RESULT"))
          hashes = res("HASHES_RESULT")
          if preview != "success":
              verdict = f"❌ 미리보기(입력 검증 포함)가 성공하지 못했습니다 ({preview}). 이후 단계는 실행되지 않았고 state 는 바뀌지 않았습니다."
          elif mode == "backup":
              if backup != "success":
                  verdict = f"❌ 백업이 성공하지 못했습니다 ({backup}). 복구는 적용되지 않았고 state 는 바뀌지 않았습니다."
              elif hashes != "success":
                  verdict = (f"⚠️ 백업은 완료됐지만 복원 state 지문 계산이 성공하지 못했습니다 ({hashes}). "
                             "REWIND 에 넣을 입력값(SHA·hash·T)은 얻지 못했습니다. 복구는 적용되지 않았고 state 는 바뀌지 않았습니다.")
              else:
                  verdict = ("✅ 백업 전용 실행이 완료됐습니다. 복구는 적용하지 않았고 state 는 바뀌지 않았습니다 "
                             "(시크릿·암호화·왕복 검증·업로드 경로 확인됨, 복원 state 지문은 hashes 잡 요약 참고. "
                             "apply 의 저장 경로는 이 실행의 확인 대상이 아닙니다).")
          elif mode == "apply":
              if approve != "success":
                  verdict = f"⏹️ 승인 게이트에서 중단됐습니다 ({approve}). 백업과 복구는 실행되지 않았습니다."
              elif backup != "success":
                  verdict = f"❌ 백업이 성공하지 못해({backup}) 복구를 진행하지 않았습니다. state 는 바뀌지 않았습니다."
              elif apply_ == "success":
                  verdict = "✅ 적용 잡이 성공했습니다 (독립 검증 통과 + 새 캐시 존재 확인까지 완료). 상세 감사 기록은 적용 잡의 요약을 보세요."
              else:
                  verdict = (f"❌ 적용 잡이 성공하지 못했습니다 ({apply_}). 적용 잡 요약의 단계별 결과를 확인하고, "
                             "저장 단계까지 갔다면 캐시 목록도 확인하세요.")
          else:
              verdict = "ℹ️ 미리보기만 실행했습니다 (backup·apply 는 실행되지 않았고, 저장도 없었습니다)."
          lines = [
              "## 복구 워크플로 최종 요약",
              "",
              verdict,
              "",
              f"- 실행 범위(`confirm`): `{mode or '미리보기'}` / 브로커 `{env.get('IN_BROKER', '')}` / 종목 `{env.get('IN_SYMBOL', '')}` / 동작 `{env.get('IN_ACTION', '')}`",
              f"- 워크플로 커밋: `{env.get('WORKFLOW_SHA', '')}` / 실행 번호: `{env.get('GITHUB_RUN_ID', '')}`",
              "",
              "| 잡 | 결과 |",
              "|---|---|",
              f"| 미리보기 | {preview} |",
              f"| 승인 게이트 | {approve} |",
              f"| 암호화 백업 | {backup} |",
              f"| 복원 state 지문 계산 | {hashes} |",
              f"| 적용 | {apply_} |",
          ]
          with open(env["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY
