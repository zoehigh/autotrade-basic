name: Backup state caches (encrypted)

# Read-only recovery of known cache snapshots. Never executes trading.
# 이전 키(40009255811 등 6개)는 캐시 보존기간(7일 미사용)으로 이미 만료돼 제거했습니다.
# 현재 대상: NHPlug 데모 SOXL 복구 전 스냅샷 (11/6 실행 직후 캐시, 복구 전 백업용)
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  backup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: nhplug-soxl-repair-before
            key: state-nhplug-demo-42287486160

    steps:
      - name: Restore the exact snapshot
        uses: actions/cache/restore@v4
        with:
          path: .state.json
          key: ${{ matrix.key }}
          fail-on-cache-miss: true

      - name: Validate and encrypt without printing state
        shell: bash
        env:
          PASSPHRASE: ${{ secrets.STATE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -s .state.json
          python3 -m json.tool .state.json > /dev/null
          if [[ -z "$PASSPHRASE" ]]; then
            echo "::error::STATE_BACKUP_PASSPHRASE is empty or unavailable"
            exit 1
          fi

          printf '%s' "$PASSPHRASE" |
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --symmetric \
              --cipher-algo AES256 --s2k-digest-algo SHA256 \
              --output "backup-${{ matrix.label }}.gpg" .state.json
          test -s "backup-${{ matrix.label }}.gpg"

      - name: Upload encrypted snapshot only
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ matrix.label }}
          path: backup-${{ matrix.label }}.gpg
          if-no-files-found: error
          retention-days: 7
