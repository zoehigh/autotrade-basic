name: 정산 근거 검증 (read-only)

# trading 실행 완료 후 `needs`로 호출됩니다 (trade_base.yml).
# 브로커 계좌 API를 호출하지 않고 settlement-*.json 만 독립 검산합니다.
#
# ⚠️ 이 job 은 **정산 검증**만 합니다. 주문 실행 검증(`RUN_PHASE=VERIFY`)은 거래 job 안에서
#    EXECUTE 직후 자동 실행되며, 그 결과는 `order_verify_status`/`order_verify_summary` 로
#    받아 **표시만** 합니다 (이 job 의 성패에 반영하지 않음 — 두 축을 섞지 않습니다).
#    정산 검증 성공 ≠ 주문 실행 검증 완료.
on:
  workflow_call:
    inputs:
      broker:
        description: '증권사 (kis, kiwoom, ls, toss, nhplug, meritz)'
        required: true
        type: string
      mode:
        description: '거래 모드 (DRY/LIVE) — 실행 job 이 확정한 값 (실패 시 빈 값)'
        required: false
        type: string
        default: ''
      broker_mode:
        description: '브로커 모드 (demo/real)'
        required: false
        type: string
        default: ''
      run_id:
        description: '실행 식별자'
        required: true
        type: string
      retry_num:
        description: '재시도 회차'
        required: false
        type: string
        default: ''
      code_version:
        description: '코드 버전 (github.sha)'
        required: false
        type: string
        default: ''
      trade_result:
        description: '거래 job 결과 (success/failure/cancelled)'
        required: false
        type: string
        default: ''
      order_verify_status:
        description: '주문 실행 검증(RUN_PHASE=VERIFY, 거래 job) 결과 — PASS/FAIL/NOT_EXECUTED/SKIPPED/빈 값(미도달)'
        required: false
        type: string
        default: ''
      order_verify_summary:
        description: '주문 실행 검증 요약 (통과/실패/실행안됨 건수) — 이 job 의 정산 검증과 별개'
        required: false
        type: string
        default: ''
      artifact_name:
        description: '정산 근거 artifact 이름'
        required: false
        type: string
        default: settlement-evidence
    secrets:
      EVIDENCE_PASSPHRASE:
        required: false
      STATE_BACKUP_PASSPHRASE:
        required: false

jobs:
  verify:
    # 거래 job 실패 후에도 실행 — evidence 가 없으면 검증 불가로 실패합니다.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python 설정
        run: uv python install

      - name: 의존성 설치
        run: uv sync

      - name: 거래 job 결과 확인
        run: echo "trade_result=${{ inputs.trade_result || 'unknown' }}"

      # 주문 실행 검증(RUN_PHASE=VERIFY)은 **거래 job 안에서** EXECUTE 직후 자동 실행됩니다
      # (승인 파일·전송 기록·브로커 read-only 대조). 이 job 은 그 결과를 **표시만** 합니다 —
      # 이 job 의 성패는 아래 정산 검증 결과만 나타내므로, 두 결과를 합쳐 "성공"으로 뭉개지
      # 않도록 라벨을 분리해 남깁니다.
      - name: 주문 실행 검증 결과 (표시 전용 — 이 job 의 성패와 무관)
        env:
          ORDER_VERIFY_STATUS: ${{ inputs.order_verify_status }}
          ORDER_VERIFY_SUMMARY: ${{ inputs.order_verify_summary }}
        run: |
          export LC_ALL=C
          # 외부 컨텍스트 값이므로 셸에 직접 끼워 넣지 않고 env 로만 받아,
          # 로그에 찍을 때 개행·제어문자를 제거합니다 (워크플로 명령 주입 방지).
          safe() { printf '%s' "${1//[^[:print:]]/?}"; }
          status=$(safe "${ORDER_VERIFY_STATUS:-}")
          summary=$(safe "${ORDER_VERIFY_SUMMARY:-}")
          if [[ -z "$status" ]]; then
            status="(기록 없음)"
            summary="거래 job 이 VERIFY 단계 전에 중단됐을 수 있습니다 — 주문 실행 검증 미완료"
          fi
          echo "[주문 실행 검증(VERIFY)] ${status} — ${summary}"
          if [[ "$status" != "PASS" && "$status" != "SKIPPED" ]]; then
            echo "::warning::주문 실행 검증(VERIFY)이 통과하지 않았습니다 (${status}). 정산 검증이 통과해도 주문 실행이 검증된 것은 아닙니다 — 거래 job 로그를 확인하세요."
          fi
          echo "[정산 검증] 이 job 이 아래에서 독립 검산합니다 — 위 주문 실행 검증과는 별개 결과입니다."

      - name: 정산 근거 다운로드
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ inputs.artifact_name }}
          path: evidence

      # 업로드된 근거는 암호화본(evidence.tgz.gpg)입니다. 복호화 실패는 검증 불가로 실패합니다.
      # (평문 파일이 이미 있는 구버전 artifact 수동 검증은 그대로 허용)
      - name: 정산 근거 복호화
        shell: bash
        env:
          PASSPHRASE: ${{ secrets.EVIDENCE_PASSPHRASE || secrets.STATE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          shopt -s nullglob
          enc=(evidence/*.gpg)
          if [[ ${#enc[@]} -eq 0 ]]; then
            echo "[정보] 암호화본이 없습니다 (근거 없음 또는 구버전 평문 artifact)"
            exit 0
          fi
          if [[ -z "$PASSPHRASE" ]]; then
            echo "::error::복호화 패스프레이즈가 없어 정산 근거를 검증할 수 없습니다"
            exit 1
          fi
          # 임시 디렉터리에 먼저 풀고 전부 성공했을 때만 evidence/ 로 옮깁니다
          # (손상 암호문이 일부만 풀린 채 검산 단계로 넘어가는 것을 막습니다).
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          for f in "${enc[@]}"; do
            gpg --batch --pinentry-mode loopback --passphrase-fd 3 --decrypt "$f" \
              3< <(printf '%s' "$PASSPHRASE") | tar xz -C "$stage"
          done
          mv "$stage"/* evidence/

      - name: 정산 근거 독립 검산
        env:
          BROKER: ${{ inputs.broker }}
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ inputs.run_id }}
          RETRY_NUM: ${{ inputs.retry_num }}
          CODE_VERSION: ${{ inputs.code_version }}
          BROKER_MODE: ${{ inputs.broker_mode }}
        run: |
          uv run python - <<'PY'
          import glob
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "ops")
          import verify_run

          # 이 단계는 **정산 검증**만 합니다 (settlement-*.json 독립 재계산, 브로커 API 없음).
          # 주문 실행 검증(RUN_PHASE=VERIFY)은 거래 job 이 담당하며 이 결과와 별개입니다.
          print("[정산 검증] settlement-*.json 독립 검산 (주문 실행 검증과 별개)")

          files = sorted(glob.glob("evidence/settlement-*.json"))
          if not files:
              print("[정산 검증][실패] 정산 근거 파일이 없습니다 — 검증 불가")
              sys.exit(1)

          broker = os.environ.get("BROKER", "")
          mode = os.environ.get("MODE", "")
          run_id = os.environ.get("RUN_ID", "")
          ok, problems = verify_run.verify_evidence_dir(
              "evidence",
              broker,
              mode,
              run_id=run_id or None,
              retry_num=os.environ.get("RETRY_NUM") or None,
              code_version=os.environ.get("CODE_VERSION") or None,
              broker_mode=os.environ.get("BROKER_MODE") or None,
          )
          if ok:
              print(f"[정산 검증][OK ] evidence {len(files)}건 + 최종 스냅샷 검증 통과")
          else:
              print("[정산 검증][!! ] 정산 검증 실패")
              for problem in problems:
                  print(f"       - {problem}")
              sys.exit(1)
          PY
