name: Reusable 무한매수법 베이스

on:
  workflow_call:
    inputs:
      broker:
        description: '증권사 (kis, kiwoom, ls, toss, nhplug, meritz)'
        required: false
        type: string
        default: kis
      broker_mode:
        description: '브로커 모드 (demo or real)'
        required: false
        type: string
        default: demo
      trade_mode:
        description: '거래 모드 (DRY or LIVE) — 비워두면 환경 변수 TRADE_MODE 사용'
        required: false
        type: string
      symbols:
        description: '투자 심볼 (예: TQQQ:NAS,SOXL:AMS) — 비워두면 환경 변수 SYMBOLS 사용'
        required: false
        type: string
      quiet_hours:
        description: '조용한 시간대 기능 (true/false) — 비워두면 환경 변수 QUIET_HOURS 사용'
        required: false
        type: string
      commission_rate:
        description: '수수료율 (예: 0.0025) — 비워두면 환경 변수 COMMISSION_RATE 사용'
        required: false
        type: string
      reinvest:
        description: '복리 재투자 활성화 (true/false) — 비워두면 환경 변수 REINVEST 사용'
        required: false
        type: string
      run_id:
        description: '실행 식별자 (기본: github.run_id)'
        required: false
        type: string
      retry_num:
        description: '재시도 회차 (기본: 0)'
        required: false
        type: string
      # ── 단계형 라이프사이클 (SETTLE → PREVIEW → APPROVE → EXECUTE → VERIFY) ──
      # RUN_PHASE 없는 LIVE 는 봇이 브로커 생성 전에 SystemExit(1) 로 차단합니다 (fail-closed).
      # 그래서 Actions LIVE 는 반드시 이 입력으로 단계를 지정해야 합니다.
      #  - LIFECYCLE (브로커별 real/demo 워크플로의 **기본값**): 한 job 안에서
      #    SETTLE → PREVIEW → APPROVE → EXECUTE 를 순서대로 실행합니다. PREVIEW 가 만든
      #    계획 파일(plans/*.json)과 SETTLE 정산 근거(settlement-*.json), APPROVE 승인 파일
      #    (approvals/*.json)이 **같은 러너의 같은 작업 디렉터리에 남아** 다음 단계가 그대로
      #    이어집니다 (산출물을 job 밖으로 넘기지 않습니다 — 이것이 단일 job 연쇄인 이유입니다).
      #    승인 파일은 PREVIEW 산출물에서 자동으로 이어지므로 **사람 검토 없이 자동 실행**됩니다
      #    (봇의 승인 게이트 — plan_hash·세션·상태해시 바인딩·허용오차·TTL — 는 그대로 통과해야
      #    하지만 그것은 기계적 검증일 뿐입니다). 그래서 운영 계좌(real)의 LIVE LIFECYCLE 은
      #    `reviewed=true` 표식이 없으면 실행 전에 fail-closed 로 중단합니다.
      #    VERIFY(정산 근거 독립 검산)는 이 워크플로의 verify-settlement job 이 담당합니다.
      #  - SETTLE/PREVIEW/APPROVE/EXECUTE/VERIFY: 단일 단계만 실행 (진단·수동 복구용).
      #    **앞 단계 산출물이 디스크에 남아 있어야** 동작하므로 다음 환경 전용입니다:
      #      · self-hosted runner (작업 디렉터리가 실행 간 재사용됨)
      #      · 로컬 (`.state.json`·`plans/`·`approvals/` 가 있는 작업 디렉터리)
      #    ⚠️ self-hosted 에서도 `actions/checkout` 기본값(clean: true)은 `git clean -ffdx` 로
      #    gitignore 산출물(plans/·approvals/·settlement-*.json·odno-map-*.jsonl)을 지워
      #    체인을 끊습니다. 그래서 이 워크플로는 단독 단계일 때만 `clean: false` 로 산출물을
      #    보존하고(첫 단계 '실행 단계 정규화' 가 판정), LIFECYCLE·레거시는 clean: true 입니다
      #    (이전 실행 산출물이 이번 자동 체인에 섞이지 않도록).
      #    GitHub hosted(fresh) 러너는 checkout 만 하고 캐시로는 `.state.json` 만 복원하므로
      #    plans//approvals//settlement-*.json 이 없습니다 → APPROVE 는 승인할 계획을 찾지
      #    못하고, EXECUTE/VERIFY 는 `settled_from_state`(정산 근거)를 만들 수 없습니다.
      #    그래서 hosted 단독 실행은 **봇 실행 전에 fail-closed 로 중단**합니다
      #    ('실행 시간 예산 검증' 단계. 근거 없는 실행·검증을 조용히 통과시키지 않음).
      #    산출물을 job artifact 로 넘기는 방식은 정산 근거·주문번호 원장의 **평문 원문 주문
      #    번호**를 artifact storage 에 올려야 해서 채택하지 않았습니다 (Evidence 는 gpg
      #    암호화본만 업로드한다는 기존 원칙과 충돌).
      #    hosted 에서의 정식 경로는 LIFECYCLE + 이 워크플로의 verify-settlement job 입니다.
      #  - 빈 값: 레거시 단일 실행 (DRY 미리보기 전용 — LIVE 는 봇이 차단).
      # 호출 워크플로(브로커별)는 real/demo 모두 기본 LIFECYCLE 을 넘깁니다
      # (real 은 LIVE 주문 경로에 reviewed=true 게이트가 계속 적용됩니다).
      run_phase:
        description: '실행 단계 (LIFECYCLE|SETTLE|PREVIEW|APPROVE|EXECUTE|VERIFY) — 단독 단계는 self-hosted(작업 디렉터리 재사용, checkout clean:false) 전용이며 hosted 는 실행 전 중단. 비워두면 레거시 단일 실행(DRY 전용)'
        required: false
        type: string
      # 운영 계좌(real)의 **LIVE 주문 경로**에 대한 사람 검토 표식.
      # 대상: run_phase=LIFECYCLE(자동 승인·실행), run_phase=EXECUTE, PREVIEW+AUTO_EXECUTE=true.
      # 값이 'true'(또는 1/yes/on)가 아니면 봇을 실행하지 않고 중단합니다 (브로커 호출·주문·
      # state 변경 없음). 기본값이 없으므로 dispatch payload 로 명시해야 합니다:
      #   {"run_phase":"LIFECYCLE","reviewed":"true","trade_mode":"LIVE"}
      # 아침(KST 오전)에는 프리장 개장까지 6시간을 넘게 대기해 hosted 러너가 강제 종료되므로,
      # 저녁 dispatch 로 실행하거나 아침에는 run_phase=PREVIEW 만 쓰세요 (아래 게이트 참고).
      # 단, KST 04:10 처럼 미국 정규장이 **진행 중**인 시각은 대기하지 않습니다 (아래 게이트).
      reviewed:
        description: '사람 검토 표식 (운영 계좌 real 의 LIVE LIFECYCLE/EXECUTE 에 필수) — true/1/yes/on 만 허용'
        required: false
        type: string
      # 수동 승인 경로의 **계획 해시 바인딩** (외부 리뷰 P1).
      # `reviewed=true` 는 "사람이 검토했다"는 선언일 뿐 **무엇을** 검토했는지 증명하지
      # 않습니다. PREVIEW 보다 먼저 전달되면 사람이 가격·수량을 보지 않고도 승인·실행까지
      # 자동 진행됩니다. 그래서 수동 단계(APPROVE/EXECUTE)에서는 PREVIEW 가 만든
      # `plan_hash` 를 함께 넘겨, 봇이 계획 파일/승인 파일의 plan_hash 와 대조합니다
      # (불일치 = 승인/실행 중단). 다중 대상은 쉼표로 **같은 개수**만큼 넘깁니다.
      #  - 운영 계좌(real) + LIVE + APPROVE/EXECUTE: 이 값이 **필수**입니다 (아래 게이트).
      #  - LIFECYCLE(완전 자동): 바인딩할 사람 검토 값이 없으므로 사용하지 않습니다.
      plan_hash:
        description: '사람이 검토한 계획의 plan_hash (수동 APPROVE/EXECUTE 바인딩, 64자리 hex, 다중은 쉼표) — real LIVE 수동 승인은 필수'
        required: false
        type: string
      plan_id:
        description: 'APPROVE 대상 계획 (PREVIEW plan_id 또는 plans/*.json 경로, 쉼표로 다중 지정 가능)'
        required: false
        type: string
      approval_plan_id:
        description: 'EXECUTE/VERIFY 대상 승인 (approval plan_id 또는 approvals/*.json 경로, 쉼표로 다중 지정 가능)'
        required: false
        type: string
      auto_execute:
        description: 'PREVIEW 직후 자동 승인·실행 (opt-in, true/false) — LIFECYCLE 경로에서는 사용하지 않음'
        required: false
        type: string
    secrets:
      # KIS secrets (broker=kis 일 때만 사용됨)
      KIS_APP_KEY:
        required: false
      KIS_APP_SECRET:
        required: false
      KIS_ACCOUNT_NO:
        required: false
      # 키움 secrets (broker=kiwoom 일 때만 사용됨)
      KIWOOM_APP_KEY:
        required: false
      KIWOOM_APP_SECRET:
        required: false
      # LS secrets (broker=ls 일 때만 사용됨)
      LS_APP_KEY:
        required: false
      LS_APP_SECRET:
        required: false
      # 토스 secrets (broker=toss 일 때만 사용됨)
      TOSS_APP_KEY:
        required: false
      TOSS_APP_SECRET:
        required: false
      # NHPLUG secrets (broker=nhplug 일 때만 사용됨)
      NHPLUG_APP_KEY:
        required: false
      NHPLUG_APP_SECRET:
        required: false
      NHPLUG_ACCT_NO:
        required: false
      # 메리츠 secrets (broker=meritz 일 때만 사용됨 — 계좌번호 불필요)
      MERITZ_APP_KEY:
        required: false
      MERITZ_APP_SECRET:
        required: false
      # 공통 secrets
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
      # Finnhub 실시간 시세 fallback (LS 증권 g3101 실패 시)
      FINNHUB_API_KEY:
        required: false
      # 정산 근거 암호화 (없으면 STATE_BACKUP_PASSPHRASE 로 대체)
      EVIDENCE_PASSPHRASE:
        required: false
      STATE_BACKUP_PASSPHRASE:
        required: false
      # 승인 파일 계좌 지문(HMAC-SHA256) 키 — LIVE 승인/실행에 **필수**.
      # 봇(src/pipeline.py `_account_fingerprint_secret`)은 LIVE 에서 이 값이 없으면
      # 승인/실행을 fail-closed 로 중단합니다 (짧은 계좌번호가 승인 파일 지문에서
      # 전수 대입으로 복원되는 것을 막기 위한 서버 비밀값).
      # 환경(environment: {broker}-{mode}) 비밀값으로 설정하세요. 값은 로그에
      # 절대 출력하지 않으며(봇도 echo 하지 않음), GitHub 이 secrets 값 자동 마스킹을 합니다.
      ACCOUNT_FINGERPRINT_SECRET:
        required: false

jobs:
  run-trade:
    # 키움/토스 real은 접근 IP 제약으로 self-hosted runner 사용, 나머지는 ubuntu-latest
    runs-on: ${{ ((inputs.broker == 'kiwoom' || inputs.broker == 'toss') && inputs.broker_mode == 'real') && format('{0}-real', inputs.broker) || 'ubuntu-latest' }}
    # GitHub Environments: broker-mode 조합별 secrets/variables 분리
    # 환경 예: kis-demo, kis-real, kiwoom-demo, kiwoom-real, ls-demo, ls-real, toss-real
    environment: ${{ inputs.broker }}-${{ inputs.broker_mode }}
    # hosted 러너의 6시간 하드 제한보다 **먼저** 실패시켜, 강제 종료로 Evidence·검증 단계가
    # 통째로 사라지는 상황을 막습니다.
    # self-hosted(키움/토스 real)는 6시간 제한이 없고 프리장 대기(최대 ~7.5h)가 정상이므로
    # 더 긴 기본값을 씁니다. 두 값 모두 var 로 조정할 수 있습니다 (정수 문자열만 —
    # 정수가 아니면 fromJSON 이 잡 시작 전에 실패합니다 = fail-closed).
    #   vars.JOB_TIMEOUT_MINUTES              (기본 350 = 5시간 50분, hosted)
    #   vars.SELF_HOSTED_JOB_TIMEOUT_MINUTES  (기본 720 = 12시간, self-hosted)
    #
    # ⚠️ job-level timeout 은 만료되면 **실행 중인 스텝과 이후 스텝을 모두 종료**시키므로
    #    always() 사후 단계(정산 스냅샷·state 캐시 저장·Evidence 암호화/업로드)가 실행되지
    #    않습니다. 그래서 실제 방어선은 **봇 실행 스텝의 step-level timeout** 이고
    #    (아래 '실행 시간 예산 검증' 단계가 job timeout - 최소 10분 으로 계산), 이 job-level
    #    값은 그보다 **긴 최후의 안전망**입니다. 봇 스텝 timeout 은
    #    vars.BOT_STEP_TIMEOUT_MINUTES 로 조정할 수 있습니다 (job 보다 10분 이상 짧아야 하며,
    #    넘으면 자동으로 job-10 으로 조정하고 ::warning:: 을 남깁니다).
    timeout-minutes: ${{ ((inputs.broker == 'kiwoom' || inputs.broker == 'toss') && inputs.broker_mode == 'real') && fromJSON(vars.SELF_HOSTED_JOB_TIMEOUT_MINUTES || '720') || fromJSON(vars.JOB_TIMEOUT_MINUTES || '350') }}
    # 동일 broker-mode 조합의 동시 실행 방지 — .state.json 동시 쓰기 충돌 방지
    concurrency:
      group: trade-${{ inputs.broker }}-${{ inputs.broker_mode }}
      cancel-in-progress: false
    outputs:
      # 검증 호출부가 **실제 실행 job 과 동일한** TRADE_MODE 를 쓰도록 전달합니다.
      trade_mode: ${{ steps.resolve.outputs.trade_mode }}
      # 주문 실행 검증(RUN_PHASE=VERIFY, 이 job 안에서 EXECUTE 직후 실행)의 결과입니다.
      # 정산 검증(verify-settlement job)과 **다른 축**이므로 섞지 않고 따로 전달합니다.
      #   PASS / FAIL / NOT_EXECUTED(승인만 되고 실행 기록 없음) / SKIPPED(검증 대상 없음)
      #   / 빈 값(게이트에서 중단되어 VERIFY 까지 가지 못함)
      order_verify_status: ${{ steps.bot.outputs.order_verify_status }}
      order_verify_summary: ${{ steps.bot.outputs.order_verify_summary }}
    steps:
      # ── 실행 단계 정규화 (체크아웃 **이전**) ─────────────────────────────
      # actions/checkout 은 기본값 clean: true 로 `git clean -ffdx && git reset --hard HEAD` 를
      # 실행합니다. 그러면 .gitignore 대상 런타임 산출물(plans/·approvals/·settlement-*.json·
      # odno-map-*.jsonl)이 **지워져** SETTLE→PREVIEW→APPROVE→EXECUTE 단계 체인이 성립하지
      # 않습니다 (self-hosted 러너의 재사용 작업 디렉터리에서도 마찬가지입니다).
      # 그래서 단독 단계(run_phase=SETTLE|PREVIEW|APPROVE|EXECUTE|VERIFY)일 때만 clean: false 로
      # 산출물을 보존하고, LIFECYCLE·레거시 실행은 기존대로 clean: true 입니다 (이전 실행의
      # 계획/승인 파일이 이번 자동 체인에 섞이지 않도록).
      # 단계 값을 체크아웃 **전에** 확정해야 하므로 셸만 사용합니다 (저장소 파일 불필요).
      # 정규화 규칙은 봇(config.read_run_phase)과 같습니다: 앞뒤 공백 제거 + 대문자.
      # 허용 목록에 없는 값은 빈 값으로 취급합니다 (출력 파일 주입 방지 — 산출물 보존 안 함).
      - name: 실행 단계 정규화
        id: phase-guard
        env:
          IN_RUN_PHASE: ${{ inputs.run_phase }}
        run: |
          set -eo pipefail
          # 로케일에 따라 대소문자 변환이 달라지지 않도록 고정합니다 (self-hosted runner 대비)
          export LC_ALL=C
          phase=$(printf '%s' "${IN_RUN_PHASE:-}" \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            | tr '[:lower:]' '[:upper:]')
          preserve=false
          case "$phase" in
            LIFECYCLE) ;;
            SETTLE | PREVIEW | APPROVE | EXECUTE | VERIFY) preserve=true ;;
            *) phase="" ;;
          esac
          echo "[단계] RUN_PHASE='${phase:-<빈 값>}' / 작업 디렉터리 산출물 보존(clean: false)=$preserve"
          echo "run_phase=$phase" >> "$GITHUB_OUTPUT"
          echo "preserve_workdir=$preserve" >> "$GITHUB_OUTPUT"

      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          # 단독 단계에서만 작업 디렉터리 산출물(plans/·approvals/·settlement-*.json·odno-map)을
          # 보존합니다. clean: true 는 git clean -ffdx 로 .gitignore 산출물까지 지웁니다.
          clean: ${{ steps.phase-guard.outputs.preserve_workdir != 'true' }}

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python 설정
        run: uv python install

      - name: 의존성 설치
        run: uv sync

      # ── 실행 시간 예산 (job timeout 안에 사후 단계 여유를 확보) ──────────────
      # job-level timeout 이 만료되면 실행 중인 스텝과 **이후 스텝이 모두 종료**되어
      # always() 사후 단계(정산 스냅샷·state 캐시 저장·Evidence 암호화/업로드)가 실행되지
      # 않습니다. 그래서 봇 실행 스텝에 job 보다 **짧은** step-level timeout-minutes 를 주고
      # 차액(최소 10분)을 사후 단계 예산으로 남깁니다.
      #   vars.JOB_TIMEOUT_MINUTES              (기본 350, hosted) — job 최후 안전망
      #   vars.SELF_HOSTED_JOB_TIMEOUT_MINUTES  (기본 720, self-hosted: 키움/토스 real)
      #   vars.BOT_STEP_TIMEOUT_MINUTES         (기본 job-10, job 보다 10분 이상 짧아야 함)
      # 정수가 아닌 값은 기본값으로 대체하고 ::warning:: 을 남깁니다 (job-level 값은 fromJSON 이라
      # 정수가 아니면 잡이 시작 전에 실패합니다 = fail-closed). job timeout 이 10분 이하이면
      # 사후 예산을 만들 수 없으므로 봇을 실행하지 않고 중단합니다.
      # 단독 단계는 앞 단계 산출물이 필요하므로 hosted 러너에서는 여기서 fail-closed 로 막습니다.
      - name: 실행 시간 예산 검증
        id: timeout-budget
        env:
          IN_BROKER: ${{ inputs.broker }}
          IN_BROKER_MODE: ${{ inputs.broker_mode }}
          IN_PHASE: ${{ steps.phase-guard.outputs.run_phase }}
          VAR_JOB_TIMEOUT: ${{ vars.JOB_TIMEOUT_MINUTES }}
          VAR_SELF_HOSTED_JOB_TIMEOUT: ${{ vars.SELF_HOSTED_JOB_TIMEOUT_MINUTES }}
          VAR_BOT_STEP_TIMEOUT: ${{ vars.BOT_STEP_TIMEOUT_MINUTES }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -eo pipefail
          export LC_ALL=C
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          # 정수 문자열만 허용합니다. 아니면 기본값으로 대체하고 경고를 남깁니다.
          # (경고를 stdout 으로 내보내므로 명령 치환 대신 전역 INT_VALUE 로 값을 돌려줍니다 —
          #  `$(...)` 로 감싸면 ::warning:: 문구가 값에 섞여 들어갑니다.)
          to_int() { # $1=값 $2=기본값 $3=변수명 → 전역 INT_VALUE
            local v
            v=$(printf '%s' "${1:-}" | tr -d '[:space:]')
            # 미설정(빈 값)은 정상입니다 — 기본값을 조용히 사용합니다.
            if [[ -z "$v" ]]; then
              INT_VALUE="$2"
              return 0
            fi
            case "$v" in
              *[!0-9]*) v="" ;;
            esac
            if [[ -z "$v" || "$v" -le 0 ]]; then
              echo "::warning::$3 값이 양의 정수 문자열이 아니어서 기본값 $2 분을 사용합니다."
              v="$2"
            fi
            INT_VALUE="$v"
          }

          # job-level timeout-minutes 와 같은 규칙으로 self-hosted 조합을 판정합니다.
          broker_norm=$(lower "${IN_BROKER:-kis}")
          broker_mode_norm=$(lower "${IN_BROKER_MODE:-demo}")
          if [[ ( "$broker_norm" == "kiwoom" || "$broker_norm" == "toss" ) && "$broker_mode_norm" == "real" ]]; then
            to_int "${VAR_SELF_HOSTED_JOB_TIMEOUT:-}" 720 "SELF_HOSTED_JOB_TIMEOUT_MINUTES"
            job_timeout="$INT_VALUE"
          else
            to_int "${VAR_JOB_TIMEOUT:-}" 350 "JOB_TIMEOUT_MINUTES"
            job_timeout="$INT_VALUE"
          fi

          slack=10
          if [[ "$job_timeout" -le "$slack" ]]; then
            echo "::error::job timeout 이 ${job_timeout}분이라 사후 단계 여유(최소 ${slack}분)를 확보할 수 없습니다. vars.JOB_TIMEOUT_MINUTES / vars.SELF_HOSTED_JOB_TIMEOUT_MINUTES 를 ${slack}분보다 큰 값으로 설정하세요. 봇을 실행하지 않고 중단합니다 (state 변경 없음)."
            exit 1
          fi

          max_bot=$((job_timeout - slack))
          to_int "${VAR_BOT_STEP_TIMEOUT:-}" "$max_bot" "BOT_STEP_TIMEOUT_MINUTES"
          bot_timeout="$INT_VALUE"
          if [[ "$bot_timeout" -gt "$max_bot" ]]; then
            echo "::warning::BOT_STEP_TIMEOUT_MINUTES=${bot_timeout} 는 job timeout(${job_timeout}분) - 사후 예산(${slack}분) 을 넘습니다. ${max_bot}분으로 조정합니다 (사후 단계가 실행되도록)."
            bot_timeout="$max_bot"
          fi
          echo "[시간 예산] 봇 실행 스텝 timeout=${bot_timeout}분 / job timeout=${job_timeout}분 (사후 단계 여유 $((job_timeout - bot_timeout))분, 러너=${RUNNER_ENVIRONMENT:-unknown})"
          echo "bot_timeout_minutes=$bot_timeout" >> "$GITHUB_OUTPUT"

          # ── 단독 단계는 앞 단계 산출물이 같은 작업 디렉터리에 남아 있어야 합니다 ──
          # hosted(fresh) 러너는 매 실행이 새 디렉터리이고, 체크아웃(clean)도 산출물을 지웁니다.
          # 근거 없이 실행·검증을 조용히 통과시키지 않도록 **봇 실행 전에** 중단합니다.
          # (산출물을 job artifact 로 넘기는 대안은 정산 근거·원장의 원문 주문번호를 평문으로
          #  업로드할 위험이 있어 채택하지 않았습니다.)
          case "${IN_PHASE:-}" in
            SETTLE | PREVIEW | APPROVE | EXECUTE | VERIFY)
              if [[ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ]]; then
                echo "::error::run_phase=${IN_PHASE} 단독 실행은 앞 단계 산출물(plans/·approvals/·settlement-*.json)이 같은 작업 디렉터리에 남아 있어야 하는데, hosted 러너는 매 실행이 새 디렉터리이고 체크아웃도 산출물을 지웁니다. 실행 전에 중단합니다 (근거 없는 실행·검증을 조용히 통과시키지 않음). hosted 의 정식 경로는 run_phase=LIFECYCLE(한 job 연속 실행) + verify-settlement 이고, 단독 단계는 self-hosted 러너 또는 로컬에서 실행하세요."
                exit 1
              fi
              echo "::notice::run_phase=${IN_PHASE} 단독 실행 — self-hosted 작업 디렉터리 산출물을 보존합니다(체크아웃 clean: false). 같은 러너·같은 작업 디렉터리에서 앞 단계를 먼저 실행했어야 합니다."
              ;;
          esac

      - name: state 캐시 복원
        # 이전 실행에서 저장한 .state.json을 불러옵니다.
        # T값, 사이클 시작일, 복리 시드 등 API로 복구할 수 없는 정보가 담겨 있습니다.
        # 캐시 키: state-{broker}-{mode}-{run_id}
        # 하위호환: KIS 브로커에 한해 기존 state-{mode}-* 캐시도 복원 (KIS 단일 브로커 시절)
        # 주의: 비-KIS 브로커는 KIS state를 물려받지 않도록 KIS 전용 폴백 사용
        id: state-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .state.json
          key: state-${{ inputs.broker }}-${{ inputs.broker_mode }}-${{ github.run_id }}
          restore-keys: |
            state-${{ inputs.broker }}-${{ inputs.broker_mode }}-
            ${{ inputs.broker == 'kis' && format('state-{0}-', inputs.broker_mode) || '_no-legacy_' }}

      # 외부 입력(trade_mode / vars.TRADE_MODE / broker_mode / broker / symbols)은 dispatch payload 등 외부에서 올 수
      # 있으므로 셸 스크립트에 `${{ }}` 로 직접 끼워 넣지 않고 env 로만 전달합니다 (셸 주입·출력 주입 방지).
      - name: Resolve and log inputs
        id: resolve
        env:
          IN_TRADE_MODE: ${{ inputs.trade_mode }}
          VAR_TRADE_MODE: ${{ vars.TRADE_MODE }}
          IN_BROKER: ${{ inputs.broker }}
          IN_BROKER_MODE: ${{ inputs.broker_mode }}
          IN_SYMBOLS: ${{ inputs.symbols }}
          VAR_SYMBOLS: ${{ vars.SYMBOLS }}
        run: |
          # 로케일에 따라 [A-Z] 범위·대소문자 변환이 달라지지 않도록 고정합니다 (self-hosted runner 대비)
          export LC_ALL=C
          # 로그에 외부 값을 찍을 때 개행·제어문자를 제거합니다 (`::` 워크플로 명령 주입 방지)
          safe() { printf '%s' "${1//[^[:print:]]/?}"; }
          # 오래된 bash(3.x)에서도 동작하도록 소문자 변환을 tr 로 합니다 (GitHub 표현식의 대소문자 무시 비교와 동일)
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }

          # inputs.trade_mode || vars.TRADE_MODE || (broker_mode == 'real' && 'DRY') || 'LIVE'  (GitHub 표현식과 같은 우선순위)
          MODE="${IN_TRADE_MODE:-}"
          if [[ -z "$MODE" ]]; then MODE="${VAR_TRADE_MODE:-}"; fi
          if [[ -z "$MODE" && "$(lower "${IN_BROKER_MODE:-}")" == "real" ]]; then MODE="DRY"; fi
          if [[ -z "$MODE" ]]; then MODE="LIVE"; fi

          # 봇(src/config.py)은 TRADE_MODE 를 strip().upper() 로 정규화합니다. state 캐시 저장 가드가
          # 실제 실행 모드와 어긋나지 않도록 같은 방식으로 정규화합니다 (예: 'live ' → 'LIVE').
          MODE=$(printf '%s' "$MODE" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | tr '[:lower:]' '[:upper:]')

          # 영문 대문자 외 값(개행·특수문자 포함)은 GITHUB_OUTPUT 에 쓰지 않고 INVALID 로 치환합니다.
          # 봇은 잘못된 값을 DRY 로 처리하고, 캐시 저장 가드도 저장하지 않습니다.
          if [[ ! "$MODE" =~ ^[A-Z]*$ ]]; then
            echo "::warning::유효하지 않은 TRADE_MODE 값을 INVALID 로 처리합니다 (봇은 DRY 로 동작, state 캐시 저장 안 함)"
            MODE="INVALID"
          fi

          # Actions 에서의 REPAIR 는 차단합니다: REPAIR 핸들러는 settlement-*.json 을 만들지 않아 verify 가 항상
          # 실패하는데, state 캐시는 검증 job 보다 앞선 이 job 에서 이미 저장됩니다. REPAIR 전용 독립 검증이
          # 준비되기 전까지는 봇 실행·state 변경·캐시 저장이 일어나기 전에 여기서 중단합니다
          # (trade_mode 출력을 쓰지 않으므로 이후 state 캐시 저장 가드도 저장하지 않습니다).
          if [[ "$MODE" == "REPAIR" ]]; then
            echo "::error::Actions 에서의 TRADE_MODE=REPAIR 는 현재 차단됩니다 (REPAIR 전용 독립 검증 미구현: 정산 근거 없이 state 만 바뀝니다). 로컬에서 docs/marker-correction-runbook.md 절차로 실행하세요. 봇 실행·state 변경·캐시 저장 없이 중단합니다."
            exit 1
          fi
          echo "trade_mode=$MODE" >> "$GITHUB_OUTPUT"

          BROKER="${IN_BROKER:-kis}"
          BROKER_MODE="${IN_BROKER_MODE:-demo}"
          SYMBOLS="${IN_SYMBOLS:-}"
          if [[ -z "$SYMBOLS" ]]; then SYMBOLS="${VAR_SYMBOLS:-}"; fi
          if [[ -z "$SYMBOLS" && "$(lower "${IN_BROKER:-}")" == "kiwoom" ]]; then SYMBOLS="TQQQ:NAS,SOXL:NYS"; fi
          if [[ -z "$SYMBOLS" ]]; then SYMBOLS="TQQQ:NAS,SOXL:AMS"; fi
          echo "Resolved BROKER=$(safe "$BROKER")"
          echo "Resolved BROKER_MODE=$(safe "$BROKER_MODE")"
          echo "Resolved TRADE_MODE=$MODE"
          echo "Resolved SYMBOLS=$(safe "$SYMBOLS")"
          echo "Environment=$(safe "${IN_BROKER}")-$(safe "${IN_BROKER_MODE}")"

      - name: 자동매매 봇 실행
        # 주문 실행 검증(VERIFY) 결과를 job output 으로 넘기기 위한 id 입니다.
        # (정산 검증 결과와 구분해 보고하려고 verify-settlement job 으로도 전달합니다)
        id: bot
        # job-level timeout 보다 **짧은** step-level timeout 입니다. 이것이 실제 방어선이며,
        # 만료되어도 always() 사후 단계(스냅샷·캐시 저장·Evidence)가 실행됩니다.
        # 값은 '실행 시간 예산 검증' 단계가 job timeout - 최소 10분 으로 계산합니다
        # (vars.BOT_STEP_TIMEOUT_MINUTES 로 조정 가능, job 보다 10분 이상 짧게 자동 조정).
        timeout-minutes: ${{ fromJSON(steps.timeout-budget.outputs.bot_timeout_minutes || '340') }}
        env:
          # 브로커 설정 (일반화)
          BROKER: ${{ inputs.broker || 'kis' }}
          BROKER_MODE: ${{ inputs.broker_mode || 'demo' }}
          # 실행 식별자/재시도 회차 — 정산 evidence 와 검증기가 같은 실행을 가리킵니다.
          RUN_ID: ${{ inputs.run_id || github.run_id }}
          RETRY_NUM: ${{ inputs.retry_num || '0' }}
          CODE_VERSION: ${{ github.sha }}

          # KIS 인증정보 (environment에서 주입 — broker=kis 일 때만 값이 있음)
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}

          # 키움 인증정보 (environment에서 주입 — broker=kiwoom 일 때만 값이 있음)
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_APP_SECRET: ${{ secrets.KIWOOM_APP_SECRET }}
          # LS 인증정보 (environment에서 주입 — broker=ls 일 때만 값이 있음)
          LS_APP_KEY: ${{ secrets.LS_APP_KEY }}
          LS_APP_SECRET: ${{ secrets.LS_APP_SECRET }}

          # 토스 인증정보 (environment에서 주입 — broker=toss 일 때만 값이 있음)
          TOSS_APP_KEY: ${{ secrets.TOSS_APP_KEY }}
          TOSS_APP_SECRET: ${{ secrets.TOSS_APP_SECRET }}
          TOSS_ACCOUNT_SEQ: ${{ vars.TOSS_ACCOUNT_SEQ }}

          # NHPLUG 인증정보 (environment에서 주입 — broker=nhplug 일 때만 값이 있음)
          NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
          NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
          NHPLUG_ACCT_NO: ${{ secrets.NHPLUG_ACCT_NO }}
          # 계좌 유형 (01:실전, 03:모의) — 비어 있으면 봇이 BROKER_MODE 로 기본값을 정합니다.
          NHPLUG_ACCT_TYPE: ${{ vars.NHPLUG_ACCT_TYPE }}

          # 메리츠 인증정보 (environment에서 주입 — broker=meritz 일 때만 값이 있음)
          # 계좌번호 불필요, BASE_URL/MAC_ADDRESS는 vars로 주입 (비밀 아님)
          MERITZ_APP_KEY: ${{ secrets.MERITZ_APP_KEY }}
          MERITZ_APP_SECRET: ${{ secrets.MERITZ_APP_SECRET }}
          MERITZ_BASE_URL: ${{ vars.MERITZ_BASE_URL }}
          MERITZ_MAC_ADDRESS: ${{ vars.MERITZ_MAC_ADDRESS }}
          # 주문 경고 재확인 전송 허용 등급 (선택, 기본 OFF — 예: 1,3)
          MERITZ_CONFIRM_WARNINGS: ${{ vars.MERITZ_CONFIRM_WARNINGS }}

          # 런타임 설정: inputs -> environment vars -> 모드별 기본값 순으로 폴백
          # real 환경은 기본 DRY (fail-safe: 명시적으로 LIVE 선택해야 실전 주문)
          # demo 환경은 기본 LIVE (모의 계좌에서 실제 주문 흐름 테스트)
          TRADE_MODE: ${{ steps.resolve.outputs.trade_mode }}
          # 복수 종목: inputs -> environment vars -> config.py 기본값
          SYMBOLS: ${{ inputs.symbols || vars.SYMBOLS }}

          # 종목별 세부 설정 (environment vars에서 주입)
          TQQQ_SPLITS: ${{ vars.TQQQ_SPLITS }}
          TQQQ_SYMBOL_TYPE: ${{ vars.TQQQ_SYMBOL_TYPE }}
          TQQQ_SEED: ${{ vars.TQQQ_SEED }}
          TQQQ_ADDITIONAL_LOC_LEVELS: ${{ vars.TQQQ_ADDITIONAL_LOC_LEVELS }}

          SOXL_SPLITS: ${{ vars.SOXL_SPLITS }}
          SOXL_SYMBOL_TYPE: ${{ vars.SOXL_SYMBOL_TYPE }}
          SOXL_SEED: ${{ vars.SOXL_SEED }}
          SOXL_ADDITIONAL_LOC_LEVELS: ${{ vars.SOXL_ADDITIONAL_LOC_LEVELS }}

          # 글로벌 추가 LOC 단계 (종목별 설정이 없을 때 폴백)
          ADDITIONAL_LOC_LEVELS: ${{ vars.ADDITIONAL_LOC_LEVELS }}

          # T값 보정 (1회성, state.json 강제 설정)
          # FORCE_T_REINFERENCE=true → last_updated 초기화 → 전체 이력에서 T 재추정
          FORCE_T_REINFERENCE: ${{ vars.FORCE_T_REINFERENCE }}
          # {SYMBOL}_FORCE_T: state.json의 T를 강제 덮어쓰기 (예: TQQQ_FORCE_T=29)
          TQQQ_FORCE_T: ${{ vars.TQQQ_FORCE_T }}
          SOXL_FORCE_T: ${{ vars.SOXL_FORCE_T }}
          # {SYMBOL}_MAX_T: T 자동추정 결과의 상한선 (분할수 초과 방지, 예: SOXL_MAX_T=19)
          TQQQ_MAX_T: ${{ vars.TQQQ_MAX_T }}
          SOXL_MAX_T: ${{ vars.SOXL_MAX_T }}

          # 런타임 옵션: inputs -> environment vars -> 코드 기본값
          QUIET_HOURS: ${{ inputs.quiet_hours || vars.QUIET_HOURS || (inputs.broker_mode == 'demo' && 'true') || 'false' }}
          COMMISSION_RATE: ${{ inputs.commission_rate || vars.COMMISSION_RATE || '0.0025' }}
          REINVEST: ${{ inputs.reinvest || vars.REINVEST || 'true' }}

          # 텔레그램 (environment에서 주입 — 브로커+모드별로 다른 채널 가능)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 개인 채팅 주문번호 원문 표시용 allowlist (쉼표 구분 chat id, 미설정 시 마스킹 전송)
          TELEGRAM_PERSONAL_CHAT_IDS: ${{ vars.TELEGRAM_PERSONAL_CHAT_IDS || '' }}

          # Finnhub 실시간 시세 fallback (LS 증권 g3101 실패 시)
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

          # LS 모의투자 API 버그 우회 (잔고/체결내역 조회 실패 시 빈 결과 반환)
          # ls-demo 환경에서 기본값 true, 나머지는 false
          LS_DEMO_BYPASS_BUGS: ${{ vars.LS_DEMO_BYPASS_BUGS || (inputs.broker == 'ls' && inputs.broker_mode == 'demo' && 'true') || 'false' }}

          # 주문이력 상세 출력 (true: LIVE 모드에서도 [주문이력 요약] 출력, 기본 false)
          ORDER_HISTORY_VERBOSE: ${{ vars.ORDER_HISTORY_VERBOSE || 'false' }}

          # 캐시 상태만 출력하고 API/전략/주문을 실행하지 않는 일회성 진단 모드
          STATE_DIAGNOSTIC_ONLY: ${{ vars.STATE_DIAGNOSTIC_ONLY || 'false' }}

          # 기대 fingerprint가 일치할 때만 캐시의 리버스 상태를 초기화하는 일회성 복구 모드
          STATE_REPAIR_ONLY: ${{ vars.STATE_REPAIR_ONLY || 'false' }}
          STATE_REPAIR_SYMBOL: ${{ vars.STATE_REPAIR_SYMBOL }}
          STATE_REPAIR_EXPECT_T: ${{ vars.STATE_REPAIR_EXPECT_T }}
          STATE_REPAIR_EXPECT_DAY_COUNT: ${{ vars.STATE_REPAIR_EXPECT_DAY_COUNT }}
          STATE_REPAIR_EXPECT_PROCEEDS: ${{ vars.STATE_REPAIR_EXPECT_PROCEEDS }}
          STATE_REPAIR_EXPECT_LAST_UPDATED: ${{ vars.STATE_REPAIR_EXPECT_LAST_UPDATED }}
          STATE_REPAIR_EXPECT_LAST_ORDNO: ${{ vars.STATE_REPAIR_EXPECT_LAST_ORDNO }}
          STATE_REPAIR_EXPECT_REVERSE_IDS: ${{ vars.STATE_REPAIR_EXPECT_REVERSE_IDS }}
          STATE_REPAIR_EXPECT_REVERSE_SUBMITTED_AT: ${{ vars.STATE_REPAIR_EXPECT_REVERSE_SUBMITTED_AT }}
          # T만 보정하고 리버스 cycle을 유지하는 일회성 복구 (오반영 T 되돌리기)
          STATE_REPAIR_TARGET_T: ${{ vars.STATE_REPAIR_TARGET_T }}

          # 기대 fingerprint가 일치할 때만 주문 fence를 1회 초기화하는 일회성 복구 모드
          STATE_CLEAR_FENCE_ONLY: ${{ vars.STATE_CLEAR_FENCE_ONLY || 'false' }}
          STATE_CLEAR_FENCE_SYMBOL: ${{ vars.STATE_CLEAR_FENCE_SYMBOL }}
          STATE_CLEAR_FENCE_EXPECT_T: ${{ vars.STATE_CLEAR_FENCE_EXPECT_T }}
          STATE_CLEAR_FENCE_EXPECT_LAST_UPDATED: ${{ vars.STATE_CLEAR_FENCE_EXPECT_LAST_UPDATED }}
          STATE_CLEAR_FENCE_EXPECT_INTENT: ${{ vars.STATE_CLEAR_FENCE_EXPECT_INTENT }}
          STATE_CLEAR_FENCE_EXPECT_BATCH: ${{ vars.STATE_CLEAR_FENCE_EXPECT_BATCH }}

          # 리버스 주문 상태 감사 (read-only, state 미저장) — 브로커 체결 vs state orders_meta 대조
          STATE_REVERSE_AUDIT_ONLY: ${{ vars.STATE_REVERSE_AUDIT_ONLY || 'false' }}

          # 리버스 주문의 실제 체결만 state에 반영하고 주문은 생성하지 않는 1회성 조정
          STATE_REVERSE_RECONCILE_ONLY: ${{ vars.STATE_REVERSE_RECONCILE_ONLY || 'false' }}

          # 기대 fingerprint(hash)가 일치할 때만 net_invested를 명시 값으로 복구하는 1회성 모드
          STATE_NET_INVESTED_REPAIR_ONLY: ${{ vars.STATE_NET_INVESTED_REPAIR_ONLY || 'false' }}
          STATE_NET_INVESTED_REPAIR_SYMBOL: ${{ vars.STATE_NET_INVESTED_REPAIR_SYMBOL }}
          STATE_NET_INVESTED_REPAIR_TARGET: ${{ vars.STATE_NET_INVESTED_REPAIR_TARGET }}
          STATE_NET_INVESTED_REPAIR_EXPECT_HASH: ${{ vars.STATE_NET_INVESTED_REPAIR_EXPECT_HASH }}
          STATE_NET_INVESTED_REPAIR_EXPECT_NET_INVESTED: ${{ vars.STATE_NET_INVESTED_REPAIR_EXPECT_NET_INVESTED }}
          STATE_NET_INVESTED_REPAIR_EXPECT_STATUS: ${{ vars.STATE_NET_INVESTED_REPAIR_EXPECT_STATUS }}

          # 키움 모의 이전 세션 zero-fill LIMIT 주문을 정책상 terminal_assumed로 처리하는 1회성 모드
          STATE_ASSUME_REVERSE_EXPIRY_ONLY: ${{ vars.STATE_ASSUME_REVERSE_EXPIRY_ONLY || 'false' }}
          STATE_ASSUME_REVERSE_EXPIRY_SYMBOL: ${{ vars.STATE_ASSUME_REVERSE_EXPIRY_SYMBOL }}
          STATE_ASSUME_REVERSE_EXPIRY_ORDER: ${{ vars.STATE_ASSUME_REVERSE_EXPIRY_ORDER }}
          STATE_ASSUME_REVERSE_EXPIRY_EXPECT_HASH: ${{ vars.STATE_ASSUME_REVERSE_EXPIRY_EXPECT_HASH }}

          # API 연결 타임아웃 (초 단위, 기본값 30초)
          CONNECT_TIMEOUT: 30

          # GitHub Actions에서 Python 출력이 line-by-line으로 표시되도록 버퍼링 해제
          PYTHONUNBUFFERED: 1

          # ── 단계형 라이프사이클 입력 (외부 값이므로 셸에 직접 끼워 넣지 않고 env 로만 전달) ──
          # 봇은 RUN_PHASE/TRADE_MODE 조합을 브로커 생성 전에 fail-closed 로 검증합니다.
          # LIFECYCLE 은 워크플로 전용 값이며 봇에 그대로 전달되지 않습니다 (아래 run 스크립트가
          # SETTLE/PREVIEW/APPROVE/EXECUTE 로 나눠 호출합니다).
          RUN_PHASE: ${{ inputs.run_phase }}
          PLAN_ID: ${{ inputs.plan_id }}
          APPROVAL_PLAN_ID: ${{ inputs.approval_plan_id }}
          AUTO_EXECUTE: ${{ inputs.auto_execute }}
          # 사람 검토 표식 — 운영 계좌(real)의 LIVE 주문 경로(LIFECYCLE/EXECUTE/AUTO_EXECUTE)에 필수.
          REVIEWED: ${{ inputs.reviewed }}
          # 사람이 검토한 계획 해시 — 수동 APPROVE/EXECUTE 에서 계획/승인 파일과 대조합니다.
          REVIEWED_PLAN_HASH: ${{ inputs.plan_hash }}
          # 실행 러너 종류 — hosted(github-hosted)는 6시간 제한이 있어 프리장 대기 상한을 적용합니다.
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          # 프리장 개장까지의 대기 허용 상한(초). 기본 4시간(14400) — SETTLE/PREVIEW/EXECUTE
          # 실행 시간과 Evidence 업로드를 합쳐도 hosted 6시간 안에 들어오도록 잡은 값입니다.
          LIFECYCLE_MAX_WAIT_SECONDS: ${{ vars.LIFECYCLE_MAX_WAIT_SECONDS }}

          # ── 승인 파일 계좌 지문(HMAC) 키 — LIVE 필수 ──
          # 봇(pipeline._account_fingerprint_secret)은 LIVE 에서 이 값이 없으면 승인/실행을
          # fail-closed 로 중단합니다. 값은 **로그로 출력하지 않습니다** (이 스텝은 echo 하지
          # 않고, 봇도 지문만 남깁니다). secrets 컨텍스트 값은 GitHub 이 자동 마스킹하므로
          # ::add-mask:: 를 따로 호출하지 않습니다 (호출하려면 값을 출력해야 해서 오히려 노출 위험).
          ACCOUNT_FINGERPRINT_SECRET: ${{ secrets.ACCOUNT_FINGERPRINT_SECRET }}
          # 계좌번호가 없는 브로커(메리츠)의 승인/실행 계좌 식별 라벨 (비밀값 아님, vars).
          # 없으면 봇이 자격증명 해시로 지문을 만들고, 자격증명도 없으면 LIVE 를 거부합니다.
          MERITZ_ACCOUNT_BINDING: ${{ vars.MERITZ_ACCOUNT_BINDING }}
          BROKER_ACCOUNT_BINDING: ${{ vars.BROKER_ACCOUNT_BINDING }}

        run: |
          set -eo pipefail

          # self-hosted runner 작업 디렉터리는 실행 간 재사용됩니다. 이전 실행이 남긴 주문번호 매핑
          # 원장(odno-map-*.jsonl)은 아래 Evidence 단계의 `odno-map-*.jsonl` 글롭에 그대로 걸려
          # **이번 실행의 암호화 Evidence 에 섞여** 업로드됩니다 (지난 실행 원문 주문번호가 이번
          # 실행 근거로 둔갑). 봇을 실행하기 **전**에 지워 이번 실행이 만든 원장만 남깁니다.
          # ⚠️ 봇 실행 **뒤**에는 절대 지우지 않습니다 — 그 시점의 원장이 이번 실행의 근거입니다.
          rm -f odno-map-*.jsonl

          PLAN_DIR_DEFAULT=plans
          APPROVALS_DIR_DEFAULT=approvals

          # RUN_PHASE 정규화 — 봇(config.read_run_phase)과 같은 규칙(앞뒤 공백 제거 + 대문자).
          # dispatch payload 등 외부에서 온 값이므로 항상 인용해 사용합니다 (셸 명령으로 해석 금지).
          phase=$(printf '%s' "${RUN_PHASE:-}" \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            | tr '[:lower:]' '[:upper:]')
          export RUN_PHASE="$phase"

          # ══ 주문 실행 검증(RUN_PHASE=VERIFY) 도우미 ═════════════════════════════════
          # EXECUTE 가 실제로 낸 주문을 승인 파일 + 전송 기록(.transmitted.json) + 브로커
          # read-only 이력/잔고로 검증합니다. **정산 검증(verify-settlement job)** 과는 다른
          # 축이므로 결과를 합치지 않고 따로 보고합니다 (정산 검증 성공 ≠ 주문 실행 검증 완료).
          #
          # 같은 job·같은 작업 디렉터리에서 돌기 때문에 VERIFY 에 필요한 산출물
          # (approvals/*.json·settlement-*.json·.state.json·plans/)이 그대로 있습니다 —
          # hosted fresh 러너에서도 산출물을 artifact 로 넘길 필요가 없습니다
          # (artifact 로 넘기면 원문 주문번호가 든 원장까지 함께 올려야 해서 채택하지 않았습니다).
          #
          # 봇의 VERIFY 종료코드: 0=실행 후 검증 통과, 1=실행 실패/검증 실패,
          #                        2=승인만 되고 실행되지 않음(검증 통과와 **다른** 상태)
          order_verify_targets=0
          order_verify_pass=0
          order_verify_failed=0
          order_verify_not_executed=0
          order_verify_problem_ids=""
          # 검증을 **명시적으로 요청**받았는지 (RUN_PHASE=VERIFY 단독 실행).
          # 대상이 0건일 때 "검증 대상이 없어 생략(SKIPPED)"과 "요청받았는데 수행하지 못함(FAIL)"을
          # 구분하기 위한 표식입니다 — 조용히 SKIPPED 로 덮으면 검증을 안 하고도 통과처럼 보입니다.
          order_verify_required=0
          # report_order_verify 가 계산한 종료 판정 (0=정상, 1=FAIL/NOT_EXECUTED/수행 불가)
          order_verify_exit=0

          # plan_id 하나를 검증합니다 (인자가 비면 상속된 APPROVAL_PLAN_ID 사용).
          run_order_verify() {
            local pid="$1"
            local rc=0
            order_verify_targets=$((order_verify_targets + 1))
            echo "[VERIFY] approval_plan_id=${pid:-<환경변수 APPROVAL_PLAN_ID>}"
            if [[ -n "$pid" ]]; then
              RUN_PHASE=VERIFY APPROVAL_PLAN_ID="$pid" uv run python trading_bot.py || rc=$?
            else
              uv run python trading_bot.py || rc=$?
            fi
            case "$rc" in
              0)
                order_verify_pass=$((order_verify_pass + 1))
                ;;
              2)
                # 승인만 되고 실행 기록이 없다 — "검증 통과"와 구분되는 상태입니다.
                order_verify_not_executed=$((order_verify_not_executed + 1))
                order_verify_problem_ids="$order_verify_problem_ids ${pid:-?}"
                echo "::error::주문 실행 검증(VERIFY): 실행 안 됨(exit 2) plan_id=${pid:-?} — 승인만 존재하고 실행 기록이 없습니다 (검증 통과가 아닙니다)"
                ;;
              *)
                order_verify_failed=$((order_verify_failed + 1))
                order_verify_problem_ids="$order_verify_problem_ids ${pid:-?}"
                echo "::error::주문 실행 검증(VERIFY) 실패(exit $rc) plan_id=${pid:-?}"
                ;;
            esac
            return 0
          }

          # 검증 대상이 없을 때(DRY 미리보기·계획 없음) 상태를 남깁니다.
          # job output 은 값이 없으면 "" 이므로, 생략도 명시적으로 기록합니다.
          mark_order_verify_skipped() { # $1 = 생략 사유
            echo "::notice::주문 실행 검증(VERIFY) 생략 — $1 (정산 검증은 verify-settlement job 이 별도 수행)"
            echo "order_verify_status=SKIPPED" >> "$GITHUB_OUTPUT"
            echo "order_verify_summary=$1" >> "$GITHUB_OUTPUT"
            return 0
          }

          # 결과 요약 — 주문 실행 검증과 정산 검증을 **구분해서** 보고합니다.
          # 판정은 `order_verify_exit` 에 남기므로 호출 측은 이 값만 확인하면 됩니다
          # (FAIL·NOT_EXECUTED·"요청했지만 대상 0건"은 모두 1).
          report_order_verify() {
            local summary
            order_verify_exit=0
            order_verify_status=""
            summary=""
            if [[ "$order_verify_targets" -eq 0 ]]; then
              if [[ "$order_verify_required" -eq 1 ]]; then
                # VERIFY 를 요청받았는데 검증한 계획이 없습니다 (APPROVAL_PLAN_ID/APPROVAL_FILE
                # 누락·빈 값). 이걸 "생략(SKIPPED)"으로 남기면 검증을 못 했는데도 통과처럼 보입니다.
                order_verify_status="FAIL"
                summary="검증 대상 없음 — RUN_PHASE=VERIFY 를 요청했지만 수행한 계획이 없습니다 (APPROVAL_PLAN_ID/APPROVAL_FILE 확인 필요)"
                order_verify_exit=1
              else
                order_verify_status="SKIPPED"
                summary="검증 대상 없음 (이 실행은 EXECUTE 가 아니어서 주문 실행 검증 대상이 없습니다)"
              fi
            elif [[ "$order_verify_failed" -gt 0 ]]; then
              order_verify_status="FAIL"
              order_verify_exit=1
            elif [[ "$order_verify_not_executed" -gt 0 ]]; then
              order_verify_status="NOT_EXECUTED"
              order_verify_exit=1
            else
              order_verify_status="PASS"
            fi
            if [[ "$order_verify_targets" -gt 0 ]]; then
              summary="통과 ${order_verify_pass}건 / 실패 ${order_verify_failed}건 / 실행안됨 ${order_verify_not_executed}건"
              if [[ -n "$order_verify_problem_ids" ]]; then
                summary="$summary (문제 plan_id:$order_verify_problem_ids)"
              fi
            fi
            order_verify_summary="$summary"
            echo "::group::[주문 실행 검증(VERIFY) 결과]"
            echo "[주문 실행 검증(VERIFY)] ${order_verify_status} — ${order_verify_summary}"
            echo "[정산 검증] 이 job 이 아니라 별도 job(verify-settlement)이 담당합니다 —"
            echo "             두 결과는 서로를 대신하지 않습니다 (합쳐서 '성공'으로 표시하지 않음)."
            echo "::endgroup::"
            echo "::notice::주문 실행 검증(VERIFY) 결과 ${order_verify_status} — ${order_verify_summary}"
            echo "order_verify_status=$order_verify_status" >> "$GITHUB_OUTPUT"
            echo "order_verify_summary=$order_verify_summary" >> "$GITHUB_OUTPUT"
            return 0
          }

          # ══ 실행 전 안전 게이트 (봇 실행·브로커 호출·state 변경 전) ══════════════════
          # 1) 운영 계좌(real)의 LIVE 주문 경로에 **사람 검토 표식**을 요구합니다.
          #    LIFECYCLE 은 PREVIEW 산출물을 자동 승인·실행하므로(같은 job 안 연쇄), 사람이
          #    개입하지 않으면 남는 것은 기계적 검증(plan_hash·세션·상태해시·허용오차·TTL)뿐입니다.
          #    그래서 주문이 나갈 수 있는 경로는 reviewed=true 표식을 명시해야 합니다.
          #    demo(모의 계좌)는 자동 체인을 그대로 허용합니다 (실계좌가 아님).
          bool_on() {
            case "$(printf '%s' "${1:-}" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')" in
              1|TRUE|YES|ON|Y) return 0 ;;
              *) return 1 ;;
            esac
          }
          broker_mode_norm=$(printf '%s' "${BROKER_MODE:-}" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          live_norm=$(printf '%s' "${TRADE_MODE:-}" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')

          places_orders=0
          if [[ "$live_norm" == "LIVE" ]]; then
            case "$phase" in
              # LIFECYCLE 은 내부에서 APPROVE 까지 자동으로 이어집니다 (EXECUTE 게이트 없음).
              LIFECYCLE) places_orders=1 ;;
              EXECUTE) places_orders=1 ;;
              # PREVIEW + AUTO_EXECUTE 는 봇이 승인·실행까지 연쇄합니다.
              PREVIEW) if bool_on "${AUTO_EXECUTE:-}"; then places_orders=1; fi ;;
            esac
          fi

          if [[ "$broker_mode_norm" == "REAL" && "$places_orders" -eq 1 ]] && ! bool_on "${REVIEWED:-}"; then
            echo "::error::운영 계좌(real) LIVE 주문 경로에는 사람 검토 표식이 필요합니다 — RUN_PHASE=${phase:-레거시}, TRADE_MODE=$live_norm. dispatch payload 에 \"reviewed\":\"true\" 를 넣어 명시(권장: 저녁 dispatch)하거나, 아침에는 run_phase=PREVIEW 로 계획만 만들고 저녁 run_phase=EXECUTE 로 실행하세요. 봇을 실행하지 않고 중단합니다 (브로커 호출·주문·state 변경 없음)."
            exit 1
          fi

          # 1-b) 수동 승인 경로의 **계획 해시 바인딩** (외부 리뷰 P1).
          #      reviewed=true 는 "사람이 검토했다"는 선언일 뿐 무엇을 검토했는지 증명하지
          #      않습니다. LIFECYCLE 처럼 PREVIEW **전에** 전달되면 사람이 가격·수량을 보지
          #      않고 승인·실행까지 자동 진행됩니다. 그래서 수동 단계(APPROVE/EXECUTE)는
          #      사람이 본 plan_id 와 plan_hash 를 함께 넘기게 하고, 봇이 계획 파일/승인
          #      파일의 plan_hash 와 대조합니다 (불일치 = 승인/실행 중단).
          #      완전 자동 경로(LIFECYCLE + reviewed=true)는 정책상 허용하되, 이 바인딩이
          #      없으므로 "사람 검토"가 아니라 "자동 진행"입니다 (ops/cron.example 참고).
          manual_approve=0
          case "$phase" in
            APPROVE|EXECUTE) manual_approve=1 ;;
          esac
          plan_hashes=()
          if [[ -n "${REVIEWED_PLAN_HASH:-}" ]]; then
            while IFS= read -r one_hash; do
              one_hash=$(printf '%s' "$one_hash" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
              [[ -z "$one_hash" ]] && continue
              if ! printf '%s' "$one_hash" | grep -Eq '^[0-9a-f]{64}$'; then
                echo "::error::plan_hash 형식이 올바르지 않습니다 (64자리 hex 필요, 입력 앞 12자: ${one_hash:0:12}…) — PREVIEW 로그/plans/*.json 의 plan_hash 를 그대로 넣으세요. 봇을 실행하지 않고 중단합니다."
                exit 1
              fi
              plan_hashes+=("$one_hash")
            done < <(printf '%s\n' "$REVIEWED_PLAN_HASH" | tr ',' '\n')
          fi
          if [[ "$broker_mode_norm" == "REAL" && "$live_norm" == "LIVE" && "$manual_approve" -eq 1 ]]; then
            if [[ "${#plan_hashes[@]}" -eq 0 ]]; then
              echo "::error::운영 계좌(real) LIVE 수동 승인(RUN_PHASE=$phase)에는 사람이 검토한 plan_hash 가 필요합니다 — dispatch 입력 plan_hash 에 PREVIEW 로그/plans/*.json 의 plan_hash 를 넣으세요 (다중 대상은 쉼표로 같은 개수). reviewed=true 만으로는 무엇을 검토했는지 증명되지 않습니다. 봇을 실행하지 않고 중단합니다 (브로커 호출·주문·state 변경 없음)."
              exit 1
            fi
          fi
          # LIFECYCLE(완전 자동)에는 바인딩할 사람 검토 값이 없습니다 — 남아 있는 값을
          # 그대로 쓰면 의미 없는 불일치로 자동 체인이 실패하므로 비웁니다.
          if [[ "$phase" == "LIFECYCLE" && "${#plan_hashes[@]}" -gt 0 ]]; then
            echo "::notice::RUN_PHASE=LIFECYCLE 은 완전 자동 경로라 plan_hash 입력을 사용하지 않습니다 (사람 검토 바인딩 없음). 수동 승인은 run_phase=APPROVE/EXECUTE + plan_hash 로 실행하세요."
            plan_hashes=()
          fi

          # 2) hosted 러너 6시간 제한 — 프리장 개장까지 대기하는 단계는 아침 dispatch 에서
          #    최대 ~7.5시간을 기다려 job 이 **강제 종료**됩니다. 강제 종료되면 Evidence 생성·
          #    업로드와 정산 검증 job 이 실행되지 않아 실행 근거가 남지 않습니다.
          #    그래서 대기 예상치가 상한(LIFECYCLE_MAX_WAIT_SECONDS, 기본 4시간)을 넘으면
          #    실행 전에 중단하고 저녁 실행을 안내합니다. self-hosted 러너는 제한이 없어 제외합니다.
          #    대기 규칙은 봇(src/pipeline_execute._wait_until_pre_market)과 **같습니다**:
          #    미국 정규장(ET 09:30~16:00)이 이미 진행 중이면 대기 0 (KST 04:10 은 ET
          #    14:10/15:10 으로 정규장 한복판 — 기다리면 하루를 놓칩니다),
          #    그 외에는 KST 17시(미국 DST) / 18시(비 DST) 개장까지 대기, TRADE_MODE=DRY 는 대기 없음.
          #    정규장 진행 판정은 봇과 같은 XNYS 캘린더(`us_session_in_progress`)를 씁니다.
          if [[ "$live_norm" == "LIVE" && ( "$phase" == "LIFECYCLE" || "$phase" == "EXECUTE" ) \
                && "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ]]; then
            wait_max="${LIFECYCLE_MAX_WAIT_SECONDS:-14400}"
            case "$wait_max" in
              '' | *[!0-9]*) wait_max=14400 ;;
            esac
            wait_reader=$(mktemp)
            cat > "$wait_reader" <<'PY'
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          # 봇과 **같은** 코드 경로를 쓰기 위해 src 를 경로에 추가합니다 (trading_bot.py 와 동일).
          sys.path.append("src")

          now_kst = datetime.now(ZoneInfo("Asia/Seoul"))
          now_utc = now_kst.astimezone(ZoneInfo("UTC"))

          # 1) 미국 정규장이 진행 중이면 대기 예상 = 0 (봇은 그때 즉시 실행합니다).
          try:
              from broker.market_utils import us_session_in_progress

              in_session = us_session_in_progress(now_utc) is not None
          except Exception:
              # 판단 불가 시 대기 규칙(KST 17/18시)으로 넘깁니다 — 보수적 방향.
              in_session = False

          if in_session:
              print(0)
          else:
              try:
                  et = now_utc.astimezone(ZoneInfo("America/New_York"))
                  dst = et.dst() is not None and et.dst().total_seconds() != 0
              except Exception:
                  # 판단 불가 시 **늦은 개장(18시)** 을 가정합니다 = 대기 시간을 크게 잡는 보수적 방향.
                  dst = False
              open_hour = 17 if dst else 18
              target = now_kst.replace(hour=open_hour, minute=0, second=0, microsecond=0)
              print(int(max(0, (target - now_kst).total_seconds())))
          PY
            wait_seconds=$(uv run python "$wait_reader" 2>/dev/null || true)
            rm -f "$wait_reader"
            case "$wait_seconds" in
              '' | *[!0-9]*)
                echo "::warning::프리장 개장까지의 대기 시간을 계산하지 못해 시간 예산 게이트를 건너뜁니다 (job timeout-minutes 로 강제 종료는 방지됩니다)."
                ;;
              *)
                echo "[시간 예산] RUN_PHASE=$phase 프리장 대기 예상=$((wait_seconds / 60))분 (허용 $((wait_max / 60))분, 러너=${RUNNER_ENVIRONMENT:-unknown})"
                if [[ "$wait_seconds" -gt "$wait_max" ]]; then
                  echo "::error::RUN_PHASE=$phase 를 지금 시작하면 프리장 개장까지 약 $((wait_seconds / 60))분을 기다립니다 (허용 $((wait_max / 60))분). GitHub hosted 러너는 6시간에서 강제 종료되어 Evidence·검증 단계가 실행되지 않습니다. **저녁(KST 17시 이후) dispatch 로 실행**하거나, 아침에는 run_phase=PREVIEW 로 계획만 만드세요. 봇을 실행하지 않고 중단합니다."
                  exit 1
                fi
                ;;
            esac
          fi
          # ══ 게이트 끝 ══════════════════════════════════════════════════════════════

          # ── 단일 단계 / 레거시 실행 ───────────────────────────────────
          # RUN_PHASE 가 비어 있으면 레거시 통합 실행입니다 (DRY 미리보기 전용 — LIVE 는 봇이 차단).
          # 단일 단계(APPROVE/EXECUTE/VERIFY)는 대상이 여러 개면 쉼표로 구분해 순서대로 실행합니다.
          if [[ "$phase" != "LIFECYCLE" ]]; then
            refs=""
            case "$phase" in
              APPROVE) refs="${PLAN_ID:-}" ;;
              EXECUTE|VERIFY) refs="${APPROVAL_PLAN_ID:-}" ;;
            esac
            if [[ "$phase" == "VERIFY" ]]; then
              # 검증을 명시적으로 요청했습니다 — 대상이 0건이면 "생략"이 아니라 실패로 기록합니다.
              order_verify_required=1
            fi
            # 검토 해시 개수는 대상 개수와 같아야 합니다 (VERIFY 는 주문이 없어 제외).
            if [[ "$phase" != "VERIFY" && "${#plan_hashes[@]}" -gt 0 ]]; then
              ref_count=0
              while IFS= read -r one; do
                [[ -n "$(printf '%s' "$one" | tr -d '[:space:]')" ]] && ref_count=$((ref_count + 1))
              done < <(printf '%s\n' "$refs" | tr ',' '\n')
              if [[ "$ref_count" -ne "${#plan_hashes[@]}" ]]; then
                echo "::error::plan_hash 개수(${#plan_hashes[@]})가 승인 대상 개수($ref_count)와 다릅니다 — 대상과 같은 순서로 쉼표 구분해 넘기세요. 봇을 실행하지 않고 중단합니다 (브로커 호출·주문·state 변경 없음)."
                exit 1
              fi
            fi
            failed=0
            if [[ "$refs" == *,* ]]; then
              idx=0
              while IFS= read -r one <&3; do
                one=$(printf '%s' "$one" | tr -d '[:space:]')
                [[ -z "$one" ]] && continue
                # 대상과 같은 순서의 사람 검토 해시를 그대로 봇에 넘깁니다.
                one_hash=""
                if [[ "$phase" != "VERIFY" ]]; then
                  one_hash="${plan_hashes[$idx]:-}"
                fi
                echo "[RUN_PHASE=$phase] 대상=$one (검토 plan_hash=${one_hash:0:12}${one_hash:+…})"
                if [[ "$phase" == "APPROVE" ]]; then
                  REVIEWED_PLAN_HASH="$one_hash" PLAN_ID="$one" uv run python trading_bot.py || failed=$((failed + 1))
                elif [[ "$phase" == "EXECUTE" ]]; then
                  REVIEWED_PLAN_HASH="$one_hash" APPROVAL_PLAN_ID="$one" uv run python trading_bot.py || failed=$((failed + 1))
                elif [[ "$phase" == "VERIFY" ]]; then
                  # VERIFY 는 종료코드(0=통과 / 1=실패 / 2=승인만·실행 안 됨)를 **집계**해야
                  # 하므로 run_order_verify 를 씁니다. `|| failed=...` 로 뭉개면
                  # "실행 안 됨"과 "검증 실패"를 구분해 보고할 수 없습니다.
                  run_order_verify "$one"
                else
                  APPROVAL_PLAN_ID="$one" uv run python trading_bot.py || failed=$((failed + 1))
                fi
                idx=$((idx + 1))
              done 3< <(printf '%s\n' "$refs" | tr ',' '\n')
            elif [[ "$phase" == "EXECUTE" ]]; then
              # EXECUTE 는 실패해도 아래 주문 실행 검증(VERIFY)을 실행해 결과를 남깁니다
              # (실패 원인과 "실행이 검증됐는지"는 다른 정보이므로 뭉개지 않습니다).
              REVIEWED_PLAN_HASH="${plan_hashes[0]:-}" uv run python trading_bot.py || failed=$((failed + 1))
            elif [[ "$phase" == "VERIFY" ]]; then
              # VERIFY 는 주문이 없어 검토 해시를 쓰지 않습니다.
              # `set -e` 로 스크립트를 죽이면 **상태 기록 전에** 종료되어 job output 이 빈 값이
              # 되므로(downstream 은 "미완료"인지 "실패"인지 알 수 없음), run_order_verify 로
              # 종료코드를 집계한 뒤 아래에서 결과를 기록하고 종료합니다.
              run_order_verify "$(printf '%s' "$refs" | tr -d '[:space:]')"
            else
              REVIEWED_PLAN_HASH="${plan_hashes[0]:-}" uv run python trading_bot.py
            fi
            # VERIFY 는 실패해도 **상태를 먼저 기록**한 뒤 종료합니다 — 기록 전에 exit 하면
            # downstream(verify-settlement 표시)이 빈 값만 보게 됩니다.
            if [[ "$failed" -ne 0 && "$phase" != "EXECUTE" && "$phase" != "VERIFY" ]]; then
              echo "::error::RUN_PHASE=$phase 실패 ${failed}건"
              exit 1
            fi

            # EXECUTE 단독 실행도 끝나면 주문 실행 검증(RUN_PHASE=VERIFY)을 자동 수행합니다.
            # 같은 job·같은 작업 디렉터리라 승인 파일·정산 근거가 그대로 있습니다.
            if [[ "$phase" == "EXECUTE" ]]; then
              echo "::group::[RUN_PHASE=EXECUTE → 주문 실행 검증(VERIFY)]"
              if [[ "$refs" == *,* ]]; then
                while IFS= read -r one <&3; do
                  one=$(printf '%s' "$one" | tr -d '[:space:]')
                  [[ -z "$one" ]] && continue
                  run_order_verify "$one"
                done 3< <(printf '%s\n' "$refs" | tr ',' '\n')
              else
                run_order_verify "$(printf '%s' "$refs" | tr -d '[:space:]')"
              fi
              echo "::endgroup::"
              report_order_verify
              if [[ "$order_verify_exit" -ne 0 ]]; then
                failed=$((failed + 1))
              fi
            elif [[ "$phase" == "VERIFY" ]]; then
              # 단독 VERIFY — 봇이 실제로 수행한 검증 결과(PASS/FAIL/NOT_EXECUTED)를 그대로
              # job output 에 남깁니다. (예전에는 검증을 하고도 여기서 SKIPPED 를 덮어써
              # "검증 생략"으로 잘못 표시됐고, 실패 시에는 기록 전에 종료돼 빈 값이 됐습니다)
              report_order_verify
              if [[ "$order_verify_exit" -ne 0 ]]; then
                echo "::error::RUN_PHASE=VERIFY 실패 — 주문 실행 검증 결과 ${order_verify_status} (${order_verify_summary})"
                exit 1
              fi
            else
              mark_order_verify_skipped "RUN_PHASE=$phase 단독 실행 (EXECUTE 가 아니므로 주문 실행 검증 대상 없음)"
            fi

            if [[ "$failed" -ne 0 ]]; then
              echo "::error::RUN_PHASE=$phase 실패 ${failed}건"
              exit 1
            fi
            exit 0
          fi

          # ── LIFECYCLE: SETTLE → PREVIEW → APPROVE → EXECUTE → VERIFY ───
          # 한 job 안에서 단계를 순서대로(별도 프로세스로) 실행합니다. 각 단계는 봇의 게이트를
          # 그대로 통과해야 하므로, APPROVE 가 남긴 승인 파일(plan_hash·세션·상태해시 바인딩,
          # 허용오차, TTL)을 통과하지 못하면 EXECUTE 는 주문을 내지 않습니다.
          # 승인 파일은 같은 작업 디렉터리에서 PREVIEW → APPROVE 로만 이어지므로
          # plan_id 수동 복사가 필요 없지만, 승인 게이트 자체는 생략되지 않습니다.
          # 5단계는 주문 실행 검증(RUN_PHASE=VERIFY)입니다 — EXECUTE 가 실제로 낸 주문이
          # 접수·전송됐는지를 승인 파일·전송 기록·브로커 read-only 대조로 확인합니다.
          # 정산 검증(ops/verify_run.py)은 이 job 이 아니라 별도 verify-settlement job 이 하며,
          # 두 결과는 서로를 대신하지 않습니다 (합쳐서 "성공"으로 표시하지 않음).
          if [[ "${TRADE_MODE:-}" != "LIVE" ]]; then
            echo "::notice::RUN_PHASE=LIFECYCLE + TRADE_MODE=${TRADE_MODE:-} → DRY 미리보기만 실행합니다 (APPROVE/EXECUTE/VERIFY 는 LIVE 전용)"
            RUN_PHASE= uv run python trading_bot.py
            mark_order_verify_skipped "TRADE_MODE=${TRADE_MODE:-} (DRY 미리보기 — 승인·실행이 없어 검증 대상 없음)"
            exit 0
          fi

          mkdir -p "$PLAN_DIR_DEFAULT" "$APPROVALS_DIR_DEFAULT"
          # self-hosted runner 작업 디렉터리 재사용에 대비해, PREVIEW 전후 계획 파일 목록을
          # 비교해 **이번 실행이 만든 계획**만 APPROVE 대상으로 삼습니다.
          plans_before=$(mktemp)
          ls -1 "$PLAN_DIR_DEFAULT" 2>/dev/null | sort > "$plans_before"

          echo "::group::[LIFECYCLE 1/5] SETTLE"
          RUN_PHASE=SETTLE uv run python trading_bot.py
          echo "::endgroup::"

          echo "::group::[LIFECYCLE 2/5] PREVIEW"
          # AUTO_EXECUTE 는 이 경로에서 쓰지 않습니다 (승인·실행은 아래 단계가 담당).
          RUN_PHASE=PREVIEW AUTO_EXECUTE=false uv run python trading_bot.py
          echo "::endgroup::"

          plans_after=$(mktemp)
          ls -1 "$PLAN_DIR_DEFAULT" 2>/dev/null | sort > "$plans_after"
          new_plans=$(mktemp)
          comm -13 "$plans_before" "$plans_after" > "$new_plans" || true
          if [[ ! -s "$new_plans" ]]; then
            echo "::notice::PREVIEW 가 새 계획을 만들지 않았습니다 (이번 세션 주문 없음) — APPROVE/EXECUTE/VERIFY 생략"
            mark_order_verify_skipped "PREVIEW 가 새 계획을 만들지 않음 (이번 세션 주문 없음)"
            exit 0
          fi

          # 계획 파일에서 plan_id 를 읽는 도우미 (jq 의존 없이 uv 파이썬 사용)
          plan_id_reader=$(mktemp)
          cat > "$plan_id_reader" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              print(json.load(fh).get("plan_id", ""))
          PY

          echo "::group::[LIFECYCLE 3/5] APPROVE"
          approved=$(mktemp)
          approve_failed=0
          while IFS= read -r plan_file <&3; do
            [[ -z "$plan_file" ]] && continue
            plan_id=$(uv run python "$plan_id_reader" "$PLAN_DIR_DEFAULT/$plan_file")
            if [[ -z "$plan_id" ]]; then
              echo "::error::계획 파일에서 plan_id 를 읽지 못했습니다: $plan_file"
              approve_failed=$((approve_failed + 1))
              continue
            fi
            echo "[APPROVE] plan_id=$plan_id (file=$plan_file)"
            # LIFECYCLE 은 완전 자동 경로입니다 — 사람 검토 해시 바인딩을 쓰지 않으므로
            # env 의 REVIEWED_PLAN_HASH 를 비웁니다 (자동 체인이 불일치로 막히지 않게).
            if REVIEWED_PLAN_HASH= RUN_PHASE=APPROVE PLAN_ID="$plan_id" uv run python trading_bot.py; then
              if [[ -f "$APPROVALS_DIR_DEFAULT/$plan_id.json" ]]; then
                printf '%s\n' "$plan_id" >> "$approved"
              else
                echo "::notice::$plan_id 는 승인 파일이 만들어지지 않았습니다 (주문 0건) — EXECUTE 제외"
              fi
            else
              echo "::error::$plan_id APPROVE 실패 — EXECUTE 에서 제외합니다"
              approve_failed=$((approve_failed + 1))
            fi
          done 3< "$new_plans"
          echo "::endgroup::"

          echo "::group::[LIFECYCLE 4/5] EXECUTE"
          execute_failed=0
          if [[ ! -s "$approved" ]]; then
            echo "::notice::승인된 계획이 없어 EXECUTE 를 생략합니다"
          else
            while IFS= read -r plan_id <&3; do
              [[ -z "$plan_id" ]] && continue
              echo "[EXECUTE] approval_plan_id=$plan_id"
              if ! REVIEWED_PLAN_HASH= RUN_PHASE=EXECUTE APPROVAL_PLAN_ID="$plan_id" uv run python trading_bot.py; then
                echo "::error::$plan_id EXECUTE 실패 — 다음 종목은 계속 진행합니다"
                execute_failed=$((execute_failed + 1))
              fi
            done 3< "$approved"
          fi
          echo "::endgroup::"

          # ── 5/5: 주문 실행 검증 (EXECUTE 실패와 무관하게 항상 실행) ──────────
          # EXECUTE 가 실패해도 남은 승인 건의 "실제 접수·전송 여부"는 따로 확인해야 하므로
          # 이 단계는 execute_failed 와 관계없이 돕니다 (실패 원인과 검증 결과를 구분).
          echo "::group::[LIFECYCLE 5/5] VERIFY (주문 실행 검증)"
          if [[ ! -s "$approved" ]]; then
            echo "::notice::승인된 계획이 없어 주문 실행 검증(VERIFY)을 생략합니다"
          else
            while IFS= read -r plan_id <&3; do
              [[ -z "$plan_id" ]] && continue
              run_order_verify "$plan_id"
            done 3< "$approved"
          fi
          echo "::endgroup::"

          rm -f "$plans_before" "$plans_after" "$new_plans" "$plan_id_reader" "$approved"

          # 주문 실행 검증 결과를 정산 검증과 구분해 보고합니다 (job output 포함).
          report_order_verify

          if [[ "$approve_failed" -ne 0 || "$execute_failed" -ne 0 \
                || "$order_verify_exit" -ne 0 ]]; then
            echo "::error::라이프사이클 실패 — APPROVE ${approve_failed}건, EXECUTE ${execute_failed}건, 주문 실행 검증(VERIFY) 실패 ${order_verify_failed}건 / 실행안됨 ${order_verify_not_executed}건 (정산 검증은 별도 job 이며 이 결과와 합치지 않습니다)"
            exit 1
          fi

      - name: 최종 정산 스냅샷 생성
        if: always()
        env:
          BROKER: ${{ inputs.broker || 'kis' }}
          BROKER_MODE: ${{ inputs.broker_mode || 'demo' }}
          TRADE_MODE: ${{ steps.resolve.outputs.trade_mode }}
          RUN_ID: ${{ inputs.run_id || github.run_id }}
          RETRY_NUM: ${{ inputs.retry_num || '0' }}
          CODE_VERSION: ${{ github.sha }}
          SYMBOLS: ${{ inputs.symbols || vars.SYMBOLS || (inputs.broker == 'kiwoom' && 'TQQQ:NAS,SOXL:NYS') || 'TQQQ:NAS,SOXL:AMS' }}
        run: |
          uv run python - <<'PY'
          import os
          from ops.verify_run import write_final_snapshot

          write_final_snapshot(
              f"final-settlement-{os.environ['RUN_ID']}.json",
              ".state.json",
              broker=os.environ.get("BROKER", ""),
              broker_mode=os.environ.get("BROKER_MODE", ""),
              trade_mode=os.environ.get("TRADE_MODE", ""),
              run_id=os.environ.get("RUN_ID", ""),
              retry_num=os.environ.get("RETRY_NUM", ""),
              code_version=os.environ.get("CODE_VERSION", ""),
              symbols=[s for s in os.environ.get("SYMBOLS", "").split(",") if s.strip()],
          )
          PY

      # state 캐시 저장 가드: 실제로 확정된 실행 모드(steps.resolve.outputs.trade_mode)가 LIVE 또는 REPAIR 일 때만
      # 새 캐시를 만듭니다. DRY·미확정·잘못된 값은 저장하지 않아 "운영 복원 후보"가 생기지 않습니다.
      # - 복원(state 캐시 복원)은 모든 모드에서 허용합니다.
      # - always() 는 유지합니다: LIVE 실행이 일부 주문 처리 후 실패해도 state 를 보존해야 합니다 (success() 금지).
      # - 입력값/BROKER_MODE 로 판단하지 않습니다 (실제 실행 모드와 다를 수 있음).
      - name: state 캐시 저장
        uses: actions/cache/save@v4
        if: ${{ always() && (steps.resolve.outputs.trade_mode == 'LIVE' || steps.resolve.outputs.trade_mode == 'REPAIR') }}
        with:
          path: .state.json
          key: state-${{ inputs.broker }}-${{ inputs.broker_mode }}-${{ github.run_id }}

      - name: state 캐시 저장 생략 안내
        if: ${{ always() && !(steps.resolve.outputs.trade_mode == 'LIVE' || steps.resolve.outputs.trade_mode == 'REPAIR') }}
        # trade_mode 는 dispatch payload 에서 올 수 있는 외부 입력이므로 셸 스크립트에 직접 끼워 넣지 않고 env 로 전달합니다.
        env:
          RESOLVED_MODE: ${{ steps.resolve.outputs.trade_mode }}
        run: |
          echo "::notice::TRADE_MODE='${RESOLVED_MODE//[^A-Za-z0-9_ -]/?}' 이므로 새 state 캐시를 저장하지 않습니다 (LIVE/REPAIR 만 저장). FORCE_T·STATE_*_ONLY 복구는 로컬에서 TRADE_MODE=REPAIR 로 실행하세요 (Actions 의 REPAIR 는 현재 차단됩니다)."

      # 정산 근거에는 원문 주문번호(skipped_unverified 등)가 들어 있습니다. 공개 저장소의
      # Artifact 는 로그인한 누구나 받을 수 있으므로 **암호화한 파일만** 업로드합니다.
      # 암호문 생성이 불가능하면(패스프레이즈 없음/gpg 없음) 평문을 올리지 않고 실패합니다.
      - name: 정산 근거 암호화
        if: always()
        shell: bash
        env:
          PASSPHRASE: ${{ secrets.EVIDENCE_PASSPHRASE || secrets.STATE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          shopt -s nullglob
          out=evidence.tgz.gpg
          partial=evidence.tgz.gpg.partial
          # 가장 먼저 이전 실행의 암호문·부분 파일·평문 tgz 를 지웁니다 (self-hosted runner 작업 디렉터리
          # 재사용 시 오래된 Evidence 가 이번 실행 것으로 업로드되는 것을 막기 위해, 존재 검사보다 앞섭니다).
          rm -f "$partial" "$out" evidence.tgz
          # 주문번호 매핑 원장(odno-map-*.jsonl)은 공개 로그의 가명 토큰을 원문으로 되돌리는
          # 유일한 근거이므로 정산 근거와 함께 암호화합니다. 평문은 남기지 않습니다.
          files=(settlement-*.json final-settlement-*.json odno-map-*.jsonl)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::warning::이번 실행에 정산 근거 파일이 없어 Evidence 를 업로드하지 않습니다 — 정산 검증 불가 (verify 단계가 실패로 보고합니다)"
            exit 0
          fi
          # trap 은 전제조건 검사보다 먼저 설치합니다. 패스프레이즈 없음·gpg 없음으로
          # 실패 종료해도 원문 주문번호가 든 평문 매핑 원장이 러너에 남지 않게 합니다.
          # 성공(rc=0) 시에는 동작하지 않고, 암호화 뒤 평문은 별도로 지웁니다.
          # 원문 주문번호가 든 매핑 원장(평문 JSONL)도 함께 지웁니다 (self-hosted runner 잔존 방지).
          trap 'rc=$?; if [[ $rc -ne 0 ]]; then rm -f "$partial" "$out" evidence.tgz; rm -f odno-map-*.jsonl 2>/dev/null || true; fi' EXIT
          if [[ -z "$PASSPHRASE" ]]; then
            echo "::error::EVIDENCE_PASSPHRASE(또는 STATE_BACKUP_PASSPHRASE)가 없어 정산 근거를 업로드하지 않습니다"
            exit 1
          fi
          command -v gpg > /dev/null || { echo "::error::gpg 가 없어 정산 근거를 암호화할 수 없습니다"; exit 1; }

          # 어떤 이유로든 실패하면 불완전한 암호문(.partial)·최종 산출물·평문 tgz 를 남기지 않습니다.
          # (업로드 단계는 산출물이 없으면 올릴 파일이 없어 경고만 합니다)

          # tar → gpg 스트리밍: 중간 평문 압축파일(evidence.tgz)을 디스크에 만들지 않습니다.
          # 패스프레이즈는 stdin(압축 데이터)과 겹치지 않도록 fd 3 으로 전달합니다.
          tar czf - "${files[@]}" |
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 3 --symmetric \
              --cipher-algo AES256 --s2k-digest-algo SHA256 \
              --output "$partial" 3< <(printf '%s' "$PASSPHRASE")
          test -s "$partial"

          # 업로드 전 왕복 검증: 복호화·압축 해제가 끝까지 되는지 확인합니다 (잘린/손상 암호문 차단).
          gpg --batch --pinentry-mode loopback --passphrase-fd 3 --decrypt "$partial" \
            3< <(printf '%s' "$PASSPHRASE") | tar tz > /dev/null

          mv "$partial" "$out"
          test -s "$out"

          # 암호화가 끝났으므로 평문 매핑 원장은 남기지 않습니다 (원문 주문번호 잔존 방지).
          # nullglob 이라 파일이 없으면 인자가 사라져 rm 이 실패하므로 || true 로 무시합니다.
          rm -f odno-map-*.jsonl 2>/dev/null || true

      - name: 정산 근거 업로드 (암호화본만)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settlement-evidence-${{ github.run_id }}
          path: evidence.tgz.gpg
          if-no-files-found: warn
          retention-days: 14

  # 정산 근거 독립 검산 — 브로커 계좌 API 호출 없이 evidence 만 검증합니다.
  verify-settlement:
    needs: run-trade
    # 거래 job 이 실패해도 evidence 가 있으면 검증하고, 없으면 검증 불가로 실패합니다.
    if: always()
    uses: ./.github/workflows/verify.yml
    secrets: inherit
    with:
      broker: ${{ inputs.broker || 'kis' }}
      broker_mode: ${{ inputs.broker_mode || 'demo' }}
      # 실제 실행 job 이 확정한 TRADE_MODE 를 그대로 사용합니다 (env 불일치 방지).
      mode: ${{ needs.run-trade.outputs.trade_mode }}
      run_id: ${{ inputs.run_id || github.run_id }}
      retry_num: ${{ inputs.retry_num || '0' }}
      code_version: ${{ github.sha }}
      trade_result: ${{ needs.run-trade.result }}
      # 주문 실행 검증(RUN_PHASE=VERIFY)은 거래 job 안에서 끝났습니다. 그 결과를 **정산 검증과
      # 섞지 않고** 나란히 보여주기 위해 전달합니다 (이 job 의 성패는 정산 검증만 나타냅니다).
      order_verify_status: ${{ needs.run-trade.outputs.order_verify_status }}
      order_verify_summary: ${{ needs.run-trade.outputs.order_verify_summary }}
      artifact_name: settlement-evidence-${{ github.run_id }}
